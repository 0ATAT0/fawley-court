ANSWERED — the room supports a consultant register, and it corrects the question in one place.**","Named in the data room as having worked on the estate:","| Discipline | Named in the room | Source |\n|---|---|---|\n| Architect (2025 scheme) | **EPR Architects** | Key Plans, Brochure, Masterplan title blocks |\n| Architect (2021 courtyard scheme) | **John Simpson Architects** (FAW1718/DOC.006) | JSA cover |\n| Planning | **Phillips Planning Services Limited** (agent, John Phillips) | LBC p. 1; JSA Appendix II p. 24 |\n| Structural | **Alan Baxter and Associates** | JSA §2.6; HE letter, JSA p. 24 |\n| Building surveying / condition | **William Martin & Partners LLP** (*Buildings Survey Report*) | JSA §2.5 |\n| Flood risk and drainage | **RAB** (*Flood Risk Assessment and Drainage Strategy*, Feb 2021) | JSA §2.7 |\n| Ecology | **Aspect Ecology** (*Ecological Scoping Survey*) and **Catherine Bickmore** (update) | JSA §13.4 |\n| Contamination | **Opus Joynes Pike** (*Phase 1 Contamination Assessment*) | JSA §13.5 |\n| Energy | **Ecovision** (*Energy Report*) | JSA §3.5 |\n| Heritage / conservation | **Dr Sarah Rutherford**, Historic Environment Ltd (*Fawley Court Conservation Plan* Vols 1–3); **Kirsty Rodwell** (*Historic Building Survey of Service Buildings*); **Marcus Binney and Associates** (Riding School justification) | JSA §1.3, §1.5, §2.4, Appendix I |\n| Landscape (historic) | **Todd Longstaffe-Gowan** (June 2012 landscape drawings, conditioned on 15/07051/FUL); **Christopher Gallagher** (important trees) | Cluster index B vision mop-up; JSA §2.9 |\n| Cost | **Greenway Associates** (historic cost estimate only) | Greenway p. 1 |\n| Residential consultancy | **Savills Global Residential Development Consultancy** (Rosie Tucker MRICS; Louis Keighley MRICS) | Savills pp. 1–3 |","**Not evidenced anywhere in the room:** catering, acoustic, **fire**, building control / approved\ninspector, utilities, access roads, river wall, AV, PDBR. Note that the question's parenthetical\n\"**fire (already on board)**\" is not corroborated by a single document in the data room — no fire\nengineer is named, no fire strategy exists, and no building control correspondence is present.\nWorth confirming on the call rather than assuming.","Also note: every one of the named reports above **exists but is not in the data room**. They are\na discrete, well-defined ask (see the outstanding register below), and several of them —\nstructural appraisal, buildings survey, FRA, ecology, contamination — are exactly the documents\nthat would otherwise have to be re-commissioned at the buyer's cost."],"sub":null,"header":false}],"count":{"label":"Hotel Development, Align call","items":6,"counts":{"ANSWERED":2,"PARTIAL":1,"JUDGMENT":3}},"intro":["---"]},{"name":"FFE","items":[{"n":"1","q":"Is the current house sufficiently completed with FFE?","status":"PARTIAL","statusLine":"**PARTIAL.** The only quantified FF&E in the room is historic and modest: within Greenway's key","body":["**PARTIAL.** The only quantified FF&E in the room is historic and modest: within Greenway's key\nclient costs, **Furniture, Furnishings & Equipment £450,000** and **Operating Equipment\n£250,000**, with **Art & Sculpture EXCLUDED** (Greenway p. 6) — £450k across 3,855 sqm of Grade I\nMain House, priced as part of the works that brought the building to its current state. That is\na private-house allowance, not a hotel FF&E position.","The 25 internal photographs show the principal rooms furnished — Great Hall, Library (four\nimages), Gibbons Room (three), Wyatt Room (three), Dining Room, Marble, Persian, Venetian and\nChinese Rooms, the Grand Stair, Print Room, two bedrooms and the Alda Freeman Suite bathrooms —\nbut they are catalogued by filename only and were not reviewed against any list (cluster index E).","**No FF&E inventory, schedule, valuation, condition report or chattels list is in the room, and\nnothing states what would be included in a sale.** Given the house is presented furnished and\nthe vendor is a Jersey company holding a Grade I house with art and antiques, the chattels\nposition is a real commercial question, not a fit-out detail."],"sub":null,"header":false},{"n":"2","q":"What else is needed - reception pods for example?","status":"JUDGMENT","statusLine":"**JUDGMENT / NOT IN ROOM.** The room fixes where reception happens — the Great Hall (1) is","body":["**JUDGMENT / NOT IN ROOM.** The room fixes where reception happens — the Great Hall (1) is\nlabelled \"Reception\" on the Main House ground floor (Key Plans p. 7) and a separate Reception (5)\nsits at the courtyard guest-room entrance in the Stables (p. 11) — and specifies nothing about\nhow it is furnished or fitted. No FF&E specification exists for any space."],"sub":null,"header":false},{"n":"3","q":"What assumption should we make for the new bedrooms - is there sufficient in the cost schedule for this? What cost schedule? We can refer to our lux cost assessments for this?","status":"PARTIAL","statusLine":"**PARTIAL.** On \"what cost schedule\" — there is none; see Hotel Development item 4 above. So","body":["**PARTIAL.** On \"what cost schedule\" — there is none; see Hotel Development item 4 above. So\nthere is nothing in which an FF&E allowance for new bedrooms could be either present or absent.","What the room does give, and it is enough to apply a per-key or per-sqm allowance: the full room\nschedule and mix. Main House 17 keys — 1 Principal Suite (6%), 2 One Bed Suites (12%), 4 Junior\nSuites (23%), 10 Guestrooms (59%), ranging 36–135 sqm (Key Plans p. 9; Area Schedule rows 14–32).\nCourtyard/Stables 43 keys — 22 at ground level (20 guest rooms 45–50 sqm, 2 suites 60–80 sqm) and\n21 at upper ground (16 guest rooms, 5 suites), individual areas 45–72 sqm (Key Plans pp. 11–12;\nArea Schedule rows 37–54). Average key size is stated as \">55 sqm\" (Brochure p. 4)."],"sub":null,"header":false},{"n":"4","q":"Is there FFE for the outside spaces as well in the cost schedule? What cost schedule?","status":"NOT IN ROOM","statusLine":"**NOT IN ROOM.** No cost schedule, and no external FF&E line anywhere. Greenway's only external","body":["**NOT IN ROOM.** No cost schedule, and no external FF&E line anywhere. Greenway's only external\nline is \"Localised Landscaping & External Works, 1 item, £2,000,000\" (Greenway p. 8) — historic,\nMain-House-adjacent, unbroken down, and not FF&E.","The room does identify the external spaces that will need it, with areas: East / river view F&B\nterrace 138 sqm, South / parkland view F&B terrace 190 sqm, Banquetting House loggia 100 sqm,\nriverside floating restaurant 75 sqm, Regatta temporary pavilion 500 sqm at 200–500 pax\n(Area Schedule rows 10, 11, 74, 75, 77), plus the new loggia/pergola and reinstated loggia\n(Masterplan p. 1) and \"various events marquees — tbc\" (Brochure p. 12)."],"sub":null,"header":false}],"count":{"label":"FFE","items":4,"counts":{"ANSWERED":0,"PARTIAL":2,"NOT IN ROOM":1,"JUDGMENT":1}},"intro":["---\n---"]}],"intro":"*Classified separately, per the second-half convention: **JUDGMENT** marks a question that is a\ndecision for Align, the operator or a consultant rather than a document request. The room\nevidence bearing on each is still set out, because most of these are answerable further than the\nquestion assumes.*\n\n**Before the section: almost every question here is answerable from one document.** The EPR key\nplans (`3.3.1`, 10 July 2025) locate the kitchen, the lift, back of house, storage, the\nwashrooms, the offices, the staff canteen, the courtyard walk, the media room and study, and the\nparking zone — and carry the consultant's own red annotations against most of them. The document\nis in the room and the mark-ups are already on it."}],"askIntro":"*Everything below is genuinely absent from the data room. Ordered by what unblocks the most work.\nItems marked **named** are documents the room proves exist, because a vendor-side document cites\nthem by title and author — those should be the easiest to obtain and the first to be asked for.*","askGroups":[{"key":"A","title":"Consent — the load-bearing gap","items":[{"n":1,"text":"**23/07589/FUL — the decision notice, conditions, plans list and any section 106.** The listed building consent is in the room; its full planning companion is not. Without it there is no evidence of a lawful hotel or guest-accommodation use, and the conditions that normally carry ecology, highways, parking, drainage, landscape and hours of operation are unseen."},{"n":2,"text":"**The approved drawing set for 23/07590/LBC**, listed by number in condition 2: 21-01/A; PL300D–PL306C; PL320C–PL322B; PV300B–PV314; PV327–PV340; SL10C–SL12B; SL326A–SL330. PL306 alone answers the washroom question; PL301/PL306/PV327–339 answer the pool, gym and spa."},{"n":3,"text":"**Evidence of commencement and condition discharge** for 23/07590/LBC — conditions 3, 6 and 7 are pre-commencement gates and the consent lapses **6 December 2027**."},{"n":4,"text":"**Implementation evidence for the seven older consents** (15/05907, 15/05908, 17/05210, 17/05211, 18/05598, 18/05599, 15/07051), whose commencement deadlines have all passed. The masterplan labels them \"Consented\"; unless lawfully commenced they are lapsed."},{"n":5,"text":"**21/05417/FUL** — riverbank erosion works, on the public record, not in the room."},{"n":6,"text":"**Pre-application paperwork for the residential scheme.** Savills reports discussions \"so far, well-received\" (p. 7) with nothing behind it. This sentence carries the enabling-development case; it needs the officer's note or letter."},{"n":7,"text":"**Pre-application paperwork for the 2023 applications and the 2025 EPR 60-key scheme.** The only pre-app document in the room is the Historic England letter of 5 July 2010."}]},{"key":"B","title":"The named reports — they exist, they are cited, they are not in the room","items":[{"n":8,"text":"**Structural Engineering Appraisal**, *Courtyard Buildings and Gatehouse*, **Alan Baxter and Associates** (named, JSA §2.6)."},{"n":9,"text":"**Buildings Survey Report**, **William Martin & Partners LLP** (named, JSA §2.5)."},{"n":10,"text":"**Flood Risk Assessment and Drainage Strategy**, **RAB**, February 2021 — including **Section 5.4** (the SuDS sizing) and **Section 4.1** (the 33.22 mAOD finished floor level) (named, JSA §2.7)."},{"n":11,"text":"**Ecological Scoping Survey**, **Aspect Ecology**, and the update by **Catherine Bickmore** (named, JSA §13.4) — with confirmation of whether bat emergence/activity surveys were done."},{"n":12,"text":"**Phase 1 Contamination Assessment**, **Opus Joynes Pike** (named, JSA §13.5)."},{"n":13,"text":"**Energy Report**, **Ecovision** (named, JSA §3.5)."},{"n":14,"text":"**Type 3 Asbestos Survey** for the courtyards (named, JSA §14.9), plus any Main House asbestos survey, register or clearance certificates."},{"n":15,"text":"**BS5837 tree survey** (referred to, JSA §2.9, §3.4)."},{"n":16,"text":"**Fawley Court Conservation Plan Vols 1–3** (Dr Sarah Rutherford) and the **Historic Building Survey of Service Buildings** (Kirsty Rodwell) (named, JSA §1.3, §2.4)."}]},{"key":"C","title":"The flood question — the single biggest unevidenced assumption","items":[{"n":17,"text":"**The Environment Agency evidence for the re-mapped flood zones.** Savills' 12-unit scheme assumes \"the existing masterplan is incorrect and the floodplains are far smaller than is currently shown… currently being updated by the environment agency\" (pp. 47, 50). The only primary evidence in the room says **Flood Zone 3** with a 33.22 mAOD floor-level requirement (RAB, quoted at JSA §2.7). A date, a reference or a revised zone plan is needed. Until it exists, the residential limb rests on hearsay."}]},{"key":"D","title":"Building condition and services — nothing exists","items":[{"n":18,"text":"Fire strategy, fire risk assessment, and the building control record with any completion certificates."},{"n":19,"text":"Fire systems: fire stopping, alarm, emergency lighting and signage, sprinklers — specification and commissioning records."},{"n":20,"text":"Fire door survey; window schedule and condition survey (Main House); roof condition survey (Main House); flue and fireplace survey."},{"n":21,"text":"MEP survey of existing systems, with a breakdown of the £5.59m MEP allowance and any outstanding works — specifically whether the part-implemented water-source heat pump (JSA §3.5) has been completed."},{"n":22,"text":"CCTV and security systems: extent, age, monitoring arrangement."},{"n":23,"text":"**Acoustic testing** — internal (room-to-room, corridor, floor) and external (A4155 road noise at the Meadows). Neither exists, and both are assumed in the room: Savills' pricing depends on \"extensive acoustic tests and noise cancellation strategies\" already having reduced road noise (p. 47)."},{"n":24,"text":"**Measured survey.** Every plan in the room is approximate, several are drawn from proposed rather than as-built information, and the Main House area basis varies from 1,815 sqm to 4,162 sqm across four documents. Nothing can be scaled."}]},{"key":"E","title":"Utilities, infrastructure and the estate edge","items":[{"n":25,"text":"Utility capacity statements and incoming supply records: power (DNO position and any connection agreement), gas, potable water, telecoms."},{"n":26,"text":"Foul drainage: cess pit locations, capacities, tankering frequency and cost, discharge consents — and a position on capacity for 60 keys plus 12 houses plus events, given \"no proposed change to the current foul sewage drainage system\" (JSA §2.8)."},{"n":27,"text":"**River wall and bank condition assessment**, and the EA permitting position for works to the bank. The masterplan states \"Long water banks to be strengthened\" with nothing behind it."},{"n":28,"text":"Dredging: any survey of the Long Water, the inlet or the river frontage — a floating restaurant is scheduled at 75 sqm."},{"n":29,"text":"Transport assessment / traffic survey. Nothing exists, and Savills records queuing on the A4155 outside the main entrance (p. 10)."},{"n":30,"text":"**Parking strategy with space counts.** The only counted figure in the room is **11 spaces**, sized in 2021 for a scheme with 15 guest rooms."}]},{"key":"F","title":"Commercial and operational","items":[{"n":31,"text":"**Premises licence(s)**, temporary event notices used to date, and the licensing history for the Regatta pavilion, weddings and events. Nothing licensing-related is in the room."},{"n":32,"text":"**Operator position:** confirmation of where the brand discussion stands, whether Belmond remains preferred, and what \"NoMad Hotel\" on the EPR title blocks refers to."},{"n":33,"text":"**FF&E inventory / chattels list**, and what is included in a sale."},{"n":34,"text":"**Reconciled key count.** The room prints 60 (EPR), 65 (Savills p. 9) and, with the South Wing's nine bedrooms, an implied 69. One number is needed before anything is costed."},{"n":35,"text":"**Reconciled area schedule.** The two revisions disagree on the Main House by 387 sqm and on whether a 127 sqm new-wing ballroom exists."},{"n":36,"text":"**A resolved staff accommodation and storage strategy** — the consented location is being converted to bedrooms, and EPR itself asks the question on its own drawing."},{"n":37,"text":"Confirmation of the residential **tenure** basis: Savills assumes 999-year leaseholds (p. 47) against the deal's freehold assumption."}]},{"key":"G","title":"Cost — the whole category","items":[{"n":38,"text":"**There is no forward cost plan in the data room.** No elemental estimate, no budget, no cost schedule for the hotel, the new build, the infrastructure, the landscape, the M&E, the residences or the FF&E. The only cost document is Greenway's historic Main House estimate. Confirm on the call that none exists, so nobody keeps looking."},{"n":39,"text":"Substantiation of the Greenway £45.79m: invoices, contracts, completion certificates and warranties — and the equivalent record for the buildings Greenway excludes (Riding School, courtyard, chapel, gate houses, perimeter and security, waterway, Capability Brown landscape, and the demolitions already carried out)."}]}],"tables":{"Vendor-facing questions":[["Section","Items","Answered","Partial","Not in room"],["Historic Construction Costs","14","0","7","7"],["Hotel Development","14","3","6","5"],["New Development","12","0","4","8"],["Residential Development","7","1","3","3"],["Planning","6","2","4","0"],["**Subtotal**","**53**","**6**","**24**","**23**"]],"Qs for Align Partners Call":[["Section","Items","Answered","Partial","Not in room","Judgment"],["Operations","23","3","14","2","4"],["Branding","1","0","1","0","0"],["Hotel Development","6","2","1","0","3"],["FFE","4","0","2","1","1"],["**Subtotal**","**34**","**5**","**18**","**3**","**8**"]],"Both halves":[["","Items","Answered","Partial","Not in room","Judgment"],["**Total**","**87**","**11**","**42**","**26**","**8**"]]},"closing":"Read plainly: **13% of the list is settled by the room, 48% is part-settled, 30% is genuinely\noutstanding** and 9% is a decision rather than a document. The large partial category is the\nuseful finding — in most cases the room gives the location, the area or the named report, and\nwhat is missing is the measurement, the cost or the document itself.","footer":"Preliminary and based on the data room, the planning research file and public record. Subject\nto confirmatory due diligence. All page references are to the documents as filed in\n`Data Room/`; JSA paragraph numbers are the document's own.","docTitle":"Fawley Court — Development Consultants' Question List vs the Data Room","docIntro":"Cross-check run 16 August 2026. Source question list: `Qs for Fawley - Hotel Development.pdf`\n(4pp). Every question in that document is reproduced below in its original order and section\nstructure, and tagged against what the vendor's data room actually contains.\n\n**Tags**\n\n- **ANSWERED** — the room settles it, with the answer and a doc + page citation.\n- **PARTIAL** — the room gives part of it; what is given and what is missing are both stated.\n- **NOT IN ROOM** — genuinely outstanding; these form the ask list at the end.\n- **JUDGMENT** — used only in the second half (\"Qs for Align Partners Call\"). The question is\n  a decision for Align or a consultant, not a document request; the room evidence bearing on\n  it is set out, then the call is named as a call.\n\n**Two things to carry before reading**\n\n1. **Several of these \"questions\" are transcriptions of mark-ups already on documents inside\n   the data room.** `3.3.1 EPR Hotel Key Plans` and `Fawley Court - Masterplan CK version.pdf`\n   both carry red annotations — \"Very small kitchen — Relocate or extend to 1\", \"Too far\",\n   \"Too small HK\", \"Check size - wc look small\", \"Use? Not bedrooms?\", \"Need 1-2 lifts\",\n   \"Spa - needs to be 200m2 bigger\", \"Check for flood plain\", \"Pavillion … currently only temp\n   licence\". Where a question restates one of these, that is noted, because the annotation is\n   the question's origin, not vendor evidence answering it.\n2. **The data room is physical, planning, title and scheme material only.** It contains no\n   trading accounts, no operating or employment records, no operator or HMA documents, no\n   forward cost plan, and no measured survey (`Data Room/INDEX.md`).\n\n**Citation keys**\n\n| Key | Document |\n|---|---|\n| Greenway | `2.7.1 Fawley Court - Historical CapEx.pdf` — Greenway Associates, *Historic Cost Estimate*, Rev 0, 20 May 2026 |\n| JSA | `3.2.1.1.2 23_07590_LBC-AMENDED-4351459.pdf` — John Simpson Architects, *Design & Access Statement*, FAW1718/DOC.006, April 2021 (filed as a decision notice; it is not one) |\n| LBC | `3.2.1.1.1 23_07590_LBC--4463285.pdf` — Buckinghamshire Council decision notice 23/07590/LBC, granted 6 December 2024 |\n| Key Plans | `3.3.1 Fawley Court - EPR Hotel Key Plans.pdf`, EPR Architects, 10/07/2025 (annotated copy) |\n| Area Schedule | `3.3.2 Fawley Court - Proposed Area Schedule.xlsx`, sheet `Area Schedule ` |\n| Brochure | `3.1.2 Fawley Court - EPR Architects Scheme Overview Brochure.pdf`, *Luxury Hospitality 2025 Proposal* |\n| Masterplan | `3.1.1 Fawley Court - Masterplan.pdf`, EPR, *Proposed Masterplan – May 2025* (annotated) |\n| Masterplan CK | `Fawley Court - Masterplan CK version.pdf` (more heavily annotated copy of the same drawing) |\n| Site Plan | `2.2.1 Fawley Court - Existing Site Plan & Listed Status.pdf`, EPR, March 2025 |\n| Savills | `3.4.1 Fawley Court - Savills Residential Feasibility Report.pdf`, 9 October 2025 (PDF page numbers) |\n| Floor Plans | `2.3.1`–`2.3.5 Fawley Court - … Floor Plan.pdf` (existing Main House, approximate) |\n\n---","totalItems":87};

<script>
/* ══════════════════════════════════════════════════════════════════════
   RENDER — BLOCKS AND EXHIBITS

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const view = $("#view");
const money = v => "£" + Number(v).toLocaleString("en-GB");
const esc = s => String(s).replace(/&(?![a-z]+;|#\d+;)/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const statusKey = s => (s || "").toLowerCase().replace(/[^a-z]/g, "");
const plain = s => String(s).replace(/&amp;/g, "&").replace(/<[^>]+>/g, "");

const CH_BY_ID = Object.fromEntries(CHAPTERS.map((c, i) => [c.id, Object.assign(c, { i })]));
const viewOf = (ch, id) => ch.views.find(v => v.id === (id || "")) || ch.views[0];

/* ─────────────  markdown, for the register bodies  ───────────── */

function inline(t) {
  return esc(t)
    .replace(/`([^`]+)`/g, (m, a) => "<code>" + a + "</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/(^|[^*])\*(?=\S)([^*\n]+?)(?<=\S)\*/g, "$1<em>$2</em>");
}

function md(blocks) {
  let out = "";
  for (const raw of blocks) {
    if (/^-{3,}$/.test(raw.trim())) continue;
    const lines = raw.split("\n");
    if (lines.every(l => l.trim().startsWith("|"))) {
      const rows = lines.filter(l => !/^\|[-: |]+\|$/.test(l.trim()))
        .map(l => l.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim()));
      if (!rows.length) continue;
      out += '<div class="tbl-scroll"><table class="tbl"><thead><tr>'
        + rows[0].map(c => "<th>" + inline(c) + "</th>").join("")
        + "</tr></thead><tbody>"
        + rows.slice(1).map(r => "<tr>" + r.map(c => "<td>" + inline(c) + "</td>").join("") + "</tr>").join("")
        + "</tbody></table></div>";
      continue;
    }
    if (/^\s*[-*] /.test(lines[0])) {
      const items = [];
      for (const l of lines) {
        if (/^\s*[-*] /.test(l)) items.push(l.replace(/^\s*[-*] /, ""));
        else if (items.length) items[items.length - 1] += " " + l.trim();
      }
      out += "<ul>" + items.map(x => "<li>" + inline(x) + "</li>").join("") + "</ul>";
      continue;
    }
    if (/^\s*\d+\. /.test(lines[0])) {
      const items = [];
      for (const l of lines) {
        if (/^\s*\d+\. /.test(l)) items.push(l.replace(/^\s*\d+\. /, ""));
        else if (items.length) items[items.length - 1] += " " + l.trim();
      }
      out += "<ol>" + items.map(x => "<li>" + inline(x) + "</li>").join("") + "</ol>";
      continue;
    }
    out += "<p>" + inline(lines.join(" ")) + "</p>";
  }
  return out;
}

/* ─────────────  block renderers  ───────────── */

function tblHTML(t) {
  const head = t.head || null;
  const aligns = head ? head.map(h => (typeof h === "object" ? (h.a || "") : "")) : [];
  const cols = head ? head.length : (t.rows[0] ? t.rows[0][1].length : 1);
  const floor = cols >= 5 ? " wide" : cols >= 3 ? " mid" : "";
  let h = '<div class="tbl-scroll' + (/wide/.test(t.cls || "") ? " wide" : floor)
    + (/labeled/.test(t.cls || "") ? " lab" : "") + '"><table class="tbl ' + (t.cls || "") + '">';
  if (head) {
    h += "<thead><tr>" + head.map(x => {
      const label = typeof x === "object" ? x.t : x, a = typeof x === "object" ? (x.a || "") : "";
      return '<th class="' + a + '">' + label + "</th>";
    }).join("") + "</tr></thead>";
  }
  h += "<tbody>";
  for (const [cls, cells] of t.rows) {
    if (cls === "divider") { h += '<tr class="divider"><td colspan="' + cols + '">' + cells[0] + "</td></tr>"; continue; }
    h += '<tr' + (cls ? ' class="' + cls + '"' : "") + ">"
      + cells.map((c, i) => '<td class="' + (aligns[i] || "") + '">' + c + "</td>").join("") + "</tr>";
  }
  if (t.note) h += '<tr class="note"><td colspan="' + cols + '">' + t.note + "</td></tr>";
  return h + "</tbody></table></div>";
}

function platesHTML(idx) {
  return '<div class="plates">' + idx.map((i, n) => {
    const p = PLATES[i];
    return '<figure class="plate-fig st" style="--i:' + (n + 2) + '">'
      + '<button class="im" data-plate="' + i + '" aria-label="Open ' + p.cap + '">'
      + '<img src="img/' + p.f + '-t.jpg" alt="' + p.alt + '" loading="lazy" width="640" height="427"></button>'
      + "<figcaption>" + p.cap + '<span class="s">Vendor data room</span></figcaption></figure>';
  }).join("") + "</div>";
}

/* the estate card's photo strip: four plates as one band, the lightbox behind it */
function stripHTML() {
  const idx = [0, 1, 4, 5];
  return '<div class="strip">' + idx.map(i => {
    const p = PLATES[i];
    return '<button data-plate="' + i + '" aria-label="Open ' + p.cap + '">'
      + '<img src="img/' + p.f + '-t.jpg" alt="' + p.alt + '" loading="lazy" width="640" height="427"></button>';
  }).join("") + '</div><p class="strip-cap">Vendor data-room photography. Eight plates, with the interiors, sit under Photography.</p>';
}

/* the sixteen dials, as the underwrite's opening surface */
function dials16HTML() {
  return '<div class="tbl-scroll lab"><table class="tbl labeled"><tbody>'
    + DIALS.map(([k, v]) => "<tr><td>" + k + "</td><td>" + v + "</td></tr>").join("")
    + "</tbody></table></div>";
}

function blockHTML(b) {
  const k = b[0];
  if (k === "lede") return '<p class="lede">' + b[1] + "</p>";
  if (k === "para") return '<p class="para">' + b[1] + "</p>";
  if (k === "subhead") return '<p class="pane-h">' + b[1] + "</p>";
  if (k === "kpis") return '<div class="kpis' + (b[1].length === 4 ? " four" : "") + '">' + b[1].map(([n, c, cls]) =>
    '<div class="kpi ' + (cls || "") + '"><div class="num">' + n + '</div><div class="cap">' + c + "</div></div>").join("") + "</div>";
  if (k === "tbl") return tblHTML(b[1]);
  if (k === "cards") return '<div class="cards two">' + b[1].map(([hh, bb]) =>
    '<div><div class="card-h">' + hh + '</div><div class="card-b">' + bb + "</div></div>").join("") + "</div>";
  if (k === "bullets") return '<div class="bullets">' + b[1].map(x => "<div>" + x + "</div>").join("") + "</div>";
  if (k === "exhibit") return "<section>" + (b[1].h ? '<h3 class="pane-h">' + b[1].h + "</h3>" : "") + b[1].b.map(blockHTML).join("") + "</section>";
  if (k === "panes") {
    const p = b[1];
    return '<div class="panes" style="--split:' + (p.split || "1fr 1fr") + '">'
      + ["left", "right"].map(sideKey => {
        const s = p[sideKey];
        return "<section>" + (s.h ? '<h3 class="pane-h">' + s.h + "</h3>" : "") + s.b.map(blockHTML).join("") + "</section>";
      }).join("") + "</div>";
  }
  if (k === "plates") return platesHTML(b[1]);
  if (k === "strip") return stripHTML();
  if (k === "src") return '<p class="src">' + b[1] + "</p>";
  if (k === "rate") return rateHTML();
  if (k === "ladder") return ladderHTML();
  if (k === "cases") return casesIndexHTML();
  if (k === "dials16") return dials16HTML();
  if (k === "bridge") return bridgeHTML();
  if (k === "read") return bridgeReadHTML();
  if (k === "wf") return b[1] === "equity" ? equityWfHTML() : "";
  if (k === "qs") return qsHTML();
  if (k === "asks") return asksHTML();
  if (k === "keys") return keysHTML();
  if (k === "cheat") return cheatHTML();
  if (k === "pnlcomp") return pnlCompHTML();
  if (k === "contact") return contactHTML();
  return "";
}

/* ─────────────  the rate field  ───────────── */

const DOM_MIN = 0, DOM_MAX = 3000;
const domStep = () => (window.innerWidth < 700 ? 1000 : 500);
const pos = v => ((Math.min(v, DOM_MAX) - DOM_MIN) / (DOM_MAX - DOM_MIN)) * 100;

function fieldRow(r, i) {
  const point = r.max <= r.min;
  const tag = r.slug ? "button" : "div";
  const cls = ["frow", r.subject ? "subject" : "", r.slug ? "link" : ""].filter(Boolean).join(" ");
  const aria = r.slug
    ? ' type="button" data-slug="' + r.slug + '" aria-label="' + r.label + ", " + (point ? money(r.min) : money(r.min) + " to " + money(r.max)) + '. Open case study."'
    : ' tabindex="0" aria-label="' + r.label + ", " + (point ? money(r.min) : money(r.min) + " to " + money(r.max)) + '"';
  let mark;
  if (point) {
    mark = '<span class="fdia" style="left:' + pos(r.min) + '%"></span>'
      + '<span class="fval" style="left:calc(' + pos(r.min) + '% + 13px)">' + money(r.min) + "</span>";
  } else {
    const l = pos(r.min), w = pos(r.max) - pos(r.min);
    mark = '<span class="fbar" data-w="' + w + '" style="left:' + l + "%;width:" + w + '%">'
      + (r.mid != null ? '<span class="fmid" style="left:' + ((r.mid - r.min) / (r.max - r.min)) * 100 + '%"></span>' : "")
      + "</span>"
      + '<span class="fval r" style="left:calc(' + l + '% - 6px)">' + money(r.min) + "</span>"

/* ─────────────  waterfalls  ───────────── */

/* One grammar for both walks. End states are drawn as full columns from the
   baseline; steps float between the levels either side of them. Position, not
   colour, separates the two kinds — navy carries every rise, rust the one fall,
   and every bar is directly labelled. */
function waterfall(spec) {
  const { items, min, max, step, w = 880, h = 300, padL = 54, padB = 62, padT = 26 } = spec;
  const plotH = h - padB - padT;
  const y = v => padT + (max - v) / (max - min) * plotH;
  const n = items.length;
  const slotW = (w - padL - 12) / n;
  const barW = Math.min(56, slotW * 0.62);
  let g = "", bars = "", axis = "";

  for (let v = min; v <= max + 1e-9; v += step) {
    const yy = y(v).toFixed(1), zero = Math.abs(v) < 1e-9;
    g += '<line x1="' + padL + '" y1="' + yy + '" x2="' + (w - 6) + '" y2="' + yy + '" stroke="' + (zero ? "#bdbdbd" : "#e2e2df") + '" stroke-width="' + (zero ? 1.2 : 1) + '"/>';
    axis += '<text x="' + (padL - 8) + '" y="' + (y(v) + 3.5).toFixed(1) + '" text-anchor="end" font-size="11" fill="#666">' + spec.fmtTick(v) + "</text>";
  }

  let cum = 0, prevX = null, links = "";
  items.forEach((it, i) => {
    const cx = padL + slotW * (i + 0.5);
    const x = cx - barW / 2;
    const isEnd = it.type === "level" || it.type === "total";
    let y0, y1, fill;
    if (isEnd) {
      y0 = y(Math.max(0, it.value)); y1 = y(Math.min(0, it.value));
      fill = "var(--accent)";
      cum = it.value;
    } else {
      const from = cum, to = cum + it.value;
      y0 = y(Math.max(from, to)); y1 = y(Math.min(from, to));
      fill = it.value < 0 ? "var(--neg)" : "var(--accent)";
      cum = to;
    }
    const top = Math.min(y0, y1), hh = Math.max(2.5, Math.abs(y1 - y0));
    /* the end states carry a charcoal cap at the value end: a level, not a step */
    const cap = isEnd
      ? '<rect x="' + x.toFixed(1) + '" y="' + (it.value < 0 ? (top + hh).toFixed(1) : (top - 3).toFixed(1)) + '" width="' + barW + '" height="3" fill="var(--charcoal)"/>'
      : "";
    bars += '<g class="wfbar" tabindex="0" role="listitem" data-i="' + i + '" data-tip="' + it.tip.replace(/"/g, "&quot;") + '" aria-label="' + it.aria + '">'
      + '<rect class="hit" x="' + (cx - slotW / 2).toFixed(1) + '" y="' + padT + '" width="' + slotW.toFixed(1) + '" height="' + plotH + '"/>'
      + '<rect class="m" x="' + x.toFixed(1) + '" y="' + top.toFixed(1) + '" width="' + barW + '" height="' + hh.toFixed(1) + '" rx="2" fill="' + fill + '"/>'
      + cap + "</g>";
    const below = it.value < 0;
    let lblY = below ? (top + hh + 16) : (top - 8);
    let lblFill = isEnd ? "var(--charcoal)" : (it.value < 0 ? "var(--neg)" : "var(--accent)");
    /* a fall that reaches the floor has no room beneath it: label it inside */
    if (below && lblY > padT + plotH - 2 && hh >= 20) { lblY = top + hh / 2 + 4; lblFill = "#fff"; }
    bars += '<text x="' + cx.toFixed(1) + '" y="' + lblY.toFixed(1) + '" text-anchor="middle" font-size="12" font-weight="700" fill="' + lblFill + '">' + it.display + "</text>";
    bars += '<text x="' + cx.toFixed(1) + '" y="' + (h - padB + 24) + '" text-anchor="middle" font-size="10.5" fill="#1a1a1a">' + it.label + "</text>";
    if (it.sub) bars += '<text x="' + cx.toFixed(1) + '" y="' + (h - padB + 37) + '" text-anchor="middle" font-size="9.5" fill="#666">' + it.sub + "</text>";
    if (prevX != null && !isEnd) {
      const cy = (it.value >= 0 ? Math.max(y0, y1) : Math.min(y0, y1));
      links += '<line x1="' + prevX.toFixed(1) + '" y1="' + cy.toFixed(1) + '" x2="' + x.toFixed(1) + '" y2="' + cy.toFixed(1)
        + '" stroke="#c9c9c9" stroke-width="1" stroke-dasharray="3 3"/>';
    }
    prevX = x + barW;
  });
  bars = links + bars;

  return '<div class="wf-scroll"><svg viewBox="0 0 ' + w + " " + h + '" role="list" aria-label="' + spec.aria + '" preserveAspectRatio="xMinYMin meet" style="min-width:' + spec.minW + 'px">'
    + g + bars + "</svg></div>";
}

    + h.calibration.map(c => "<tr><td>" + c.step + '</td><td class="r">' + c.solved.toFixed(4) + "</td>"
        + '<td class="r">' + (c.target == null ? "—" : PNLFMT.num(c.target)) + "</td>"
        + '<td class="r">' + (c.achieved == null ? "—" : PNLFMT.num(c.achieved)) + "</td></tr>").join("")
    + "</tbody></table></div>";
}

/* a hotel's estimated P&L view, on its own case page */
function pnlHotelHTML(caseSlug) {
  const h = PNL_BY_CASE[caseSlug];
  if (!h) return '<p class="para muted">No estimated P&amp;L is held for this property.</p>';
  const notes = PNL_NOTES[h.slug] || [];
  const kpis = [
    [PNLFMT.pct(h.margins.gop), "GOP margin, modelled"],
    [PNLFMT.pct(h.margins.noi), "NOI margin, modelled"],
    [PNLFMT.cur(h.memo.rev_per_key_gbp, "GBP"), "Revenue a key, sterling"],
    [PNLFMT.pct(h.memo.payroll_pct), "Implied all-staff payroll"]
  ];
  const main = '<div class="stack-lg">' + clsBanner(h)
    + '<div class="kpis four">' + kpis.map(([n, c]) =>
        '<div class="kpi"><div class="num">' + n + '</div><div class="cap">' + c + "</div></div>").join("") + "</div>"
    + '<div class="duo" style="--duo:minmax(0,56fr) minmax(0,44fr)">' + pnlTableHTML(h)
    + '<div class="stack-lg">' + pnlBasisHTML(h) + pnlMemoHTML(h) + "</div></div></div>";

  const reasonMain = '<div class="stack-lg">'
    + "<div><h3 class=\"pane-h\">What the filings give</h3><p class=\"para\" style=\"margin-top:12px\">" + h.filed_evidence + "</p></div>"
    + (notes.length ? '<div><h3 class="pane-h">What this book cannot know</h3><div class="stack" style="margin-top:12px">'
        + notes.map(n => '<p class="para">' + n + "</p>").join("") + "</div></div>" : "")
    + '<div><h3 class="pane-h">The dials, and what each rests on</h3>' + pnlDialsHTML(h) + "</div>"
    + '<div><h3 class="pane-h">Calibration</h3>' + pnlCalibHTML(h) + "</div></div>";

  const reasonSide = '<p class="src">' + PNL_PROSE.estimates[0] + " " + PNL_PROSE.estimates[1] + "</p>"
    + '<p class="src">Source: Research/comp-pnls, built ' + PNL.generated + " — one forked model per hotel on the same engine the underwrite uses, the operating interface populated and financing, capex and exit left untouched. "
    + PNL.fx.pair + " " + PNL.fx.rate + ", " + PNL.fx.basis + ". Conventions in full on the Evidence chapter's Estimated P&amp;Ls view.</p>";

  return main + '<details class="reason"><summary><span class="gl">›</span>Reasoning &amp; basis'
    + '<span class="ct">' + (notes.length + 2) + " notes</span></summary>"
    + '<div class="reason-b"><div class="rb-main">' + reasonMain + '</div><div class="rb-side">' + reasonSide + "</div></div></details>";
}

/* the comparative: eleven columns of GOP margin, the subject in its place */
function pnlCompHTML() {
  const rows = PNLFMT.ranked();
  const DMIN = -0.12, DMAX = 0.44;
  const x = v => ((v - DMIN) / (DMAX - DMIN)) * 100;
  const zero = x(0);
  const bars = rows.map(r => {
    const v = x(r.gopN), neg = r.gopN < 0;
    const left = neg ? v : zero, w = Math.abs(v - zero);
    const caseSlug = Object.keys(PNL_CASE).find(k => PNL_CASE[k] === r.slug);
    const tag = caseSlug ? "button" : "div";
    return "<" + tag + ' class="rankrow' + (r.subject ? " subj" : "") + (caseSlug ? " link" : "") + '"'
      + (caseSlug ? ' data-slug="' + caseSlug + '" data-view="pnl" aria-label="' + plain(r.name) + ", GOP margin " + r.gop + '. Open its estimated P&L."' : "")
      + '><span class="nm">' + r.name + "</span>"
      + '<span class="cl">' + r.cls.toLowerCase() + "</span>"
      + '<span class="tr"><span class="zero" style="left:' + zero.toFixed(1) + '%"></span>'
      + '<span class="b' + (neg ? " dn" : "") + '" data-w="' + w.toFixed(1) + '" style="left:' + left.toFixed(1) + "%;width:" + w.toFixed(1) + '%"></span></span>'
      + '<span class="v">' + r.gop + "</span></" + tag + ">";
  }).join("");

  const table = '<div class="tbl-scroll wide"><table class="tbl num"><thead><tr>'
    + ["Hotel", "Class", "Keys", "Open days", "ADR", "Occupancy", "GOP", "EBITDA", "NOI", "Payroll", "Revenue a key"]
        .map((c, i) => '<th class="' + (i > 1 ? "r" : "") + '">' + c + "</th>").join("")
    + "</tr></thead><tbody>"
    + rows.map(r => '<tr class="' + (r.subject ? "subject" : "") + '"><td>' + r.name + "</td><td>" + r.cls.toLowerCase() + "</td>"
        + ['<td class="r">' + r.keys + "</td>", '<td class="r">' + r.open + "</td>", '<td class="r">' + r.adr + "</td>",
           '<td class="r">' + r.occ + "</td>", '<td class="r"><b>' + r.gop + "</b></td>", '<td class="r">' + r.ebitda + "</td>",
           '<td class="r">' + r.noi + "</td>", '<td class="r">' + r.payroll + "</td>", '<td class="r">' + r.rpk + "</td>"].join("")
        + "</tr>").join("")
    + '<tr class="note"><td colspan="11">' + PNL_PROSE.subjectcol[0]
    + " Occupancy is narrated as the 60–70% interval; 0.65 is the model input. EBITDA and payroll are not published for the subject.</td></tr>"
    + "</tbody></table></div>";

  const convs = '<div class="tbl-scroll lab"><table class="tbl labeled"><tbody>'
    + Object.entries(PNL.conventions).map(([k, v]) => "<tr><td>" + (CONV_LABEL[k] || k) + "</td><td>" + v + "</td></tr>").join("")
    + "</tbody></table></div>";

  const limits = '<ol class="read" style="grid-template-columns:1fr">'
    + PNL_PROSE.limits.map(l => "<li>" + l + "</li>").join("") + "</ol>";

  const reasonMain = '<div class="stack-lg">'
    + '<div><h3 class="pane-h">These are estimates of other people’s businesses</h3>'
    + '<p class="para" style="margin-top:12px">' + PNL_PROSE.estimates[0] + "</p>"
    + '<p class="para">' + PNL_PROSE.estimates[1] + "</p></div>"
    + '<div><h3 class="pane-h">What outside-in cannot know</h3>' + limits + "</div>"
    + '<div><h3 class="pane-h">Conventions applied to all ten</h3>' + convs + "</div></div>";

  const reasonSide = '<p class="src">Source: Research/comp-pnls, built ' + PNL.generated
    + " — Companies House filings read in the original, Pappers.fr French statutory accounts, Italian Business Register data, the Align hotel database rate calendars and VOA rateable values. "
    + PNL.fx.pair + " " + PNL.fx.rate + ", " + PNL.fx.basis
    + ". Every book was recalculated Excel-native and its P&amp;L identities re-derived from the saved cells; the calibration gates pass to a largest relative miss of 0.000086%.</p>";

  return '<div class="stack-lg"><div class="rank">' + bars + "</div>"
    + '<div class="duo" style="--duo:minmax(0,50fr) minmax(0,50fr)">'
    + '<p class="lede">' + PNL_PROSE.ranking[0] + "</p>"
    + '<p class="para muted">' + PNL_PROSE.ranking[1] + "</p></div>"
    + table + "</div>"
    + '<details class="reason"><summary><span class="gl">›</span>Reasoning &amp; basis<span class="ct">13 limits · 13 conventions</span></summary>'
    + '<div class="reason-b"><div class="rb-main">' + reasonMain + '</div><div class="rb-side">' + reasonSide + "</div></div></details>";
}
</script>
<script>
/* ══════════════════════════════════════════════════════════════════════
   RENDER — THE REGISTER, THE CHEAT SHEET, THE VIEWS, THE FINDER, THE ROUTER
   ══════════════════════════════════════════════════════════════════════ */

/* ─────────────  the Fawley Questions register  ───────────── */

const ST_ORDER = ["ANSWERED", "PARTIAL", "NOT IN ROOM", "JUDGMENT"];
const QSTATE = { status: null, section: null, q: "", open: {} };

const QS_ITEMS = (() => {
  const out = [];
  QS.halves.forEach((h, hi) => h.sections.forEach((s, si) => s.items.forEach((it, ii) => {
    out.push(Object.assign({}, it, { half: h.title, halfI: hi, section: s.name, sectionI: si,
      key: hi + "-" + si + "-" + ii, secKey: hi + "-" + si }));
  })));
  return out;
})();
const QS_TALLY = (() => {
  const t = { ANSWERED: 0, PARTIAL: 0, "NOT IN ROOM": 0, JUDGMENT: 0 };
  QS_ITEMS.forEach(i => { if (i.status) t[i.status]++; });
  return t;
})();
const QS_SECTIONS = (() => {
  const out = [];
  QS.halves.forEach((h, hi) => h.sections.forEach((s, si) => out.push({ key: hi + "-" + si, name: s.name, half: h.title, count: s.count })));
  return out;
})();
const ASK_N = QS.askGroups.reduce((a, g) => a + g.items.length, 0);

function qsMatch(it) {
  if (QSTATE.status && it.status !== QSTATE.status) return false;
  if (QSTATE.section && it.secKey !== QSTATE.section) return false;
  if (QSTATE.q) {
    const hay = (it.q + " " + (it.statusLine || "") + " " + it.body.join(" ") + " " + it.section).toLowerCase();
    if (!hay.includes(QSTATE.q.toLowerCase())) return false;
  }
  return true;
}

const qsHTML = () => '<div id="register">' + qsInner() + "</div>";

function qsInner() {
  const total = QS.totalItems;
  const seg = s => (QS_TALLY[s] / total * 100).toFixed(2);

  let h = '<div class="qbar" role="img" aria-label="' + ST_ORDER.map(s => QS_TALLY[s] + " " + s.toLowerCase()).join(", ") + '">'
    + ST_ORDER.map(s => '<span class="s-' + statusKey(s) + '" style="flex:' + QS_TALLY[s] + ' 1 0">' + QS_TALLY[s] + "</span>").join("") + "</div>"
    + '<div class="qbar-key">' + ST_ORDER.map(s => '<span><i class="s-' + statusKey(s) + '"></i>' + s + " · " + QS_TALLY[s]
      + " (" + seg(s) + "%)</span>").join("") + "</div>";

  /* filters */
  h += '<div class="filters"><span class="fl">Status</span>'
    + '<button class="ft" data-qstatus="" aria-pressed="' + (!QSTATE.status) + '">All<span class="c">' + total + "</span></button>"
    + ST_ORDER.map(s => '<button class="ft" data-qstatus="' + s + '" aria-pressed="' + (QSTATE.status === s) + '"><i class="s-'
      + statusKey(s) + '"></i>' + s + '<span class="c">' + QS_TALLY[s] + "</span></button>").join("")
    + '<div class="qsearch"><span class="gl" aria-hidden="true">⌕</span><input id="qsearch" type="search" placeholder="Search the register" value="' + esc(QSTATE.q) + '" aria-label="Search the register"></div></div>';

  h += '<div class="filters"><span class="fl">Section</span>'
    + '<button class="ft" data-qsec="" aria-pressed="' + (!QSTATE.section) + '">All sections</button>'
    + QS_SECTIONS.map(s => '<button class="ft" data-qsec="' + s.key + '" aria-pressed="' + (QSTATE.section === s.key) + '">'
      + s.name + '<span class="c">' + (s.count ? s.count.items : "") + "</span></button>").join("") + "</div>";

  const shown = QS_ITEMS.filter(qsMatch);
  const shownReal = shown.filter(i => !i.header).length;
  h += '<p class="qcount" aria-live="polite"><b>' + shownReal + "</b> of " + total + " questions shown"
    + (QSTATE.status || QSTATE.section || QSTATE.q ? ' · <button id="qclear" style="text-decoration:underline">clear the filters</button>' : "") + "</p>";

  if (!shownReal) {
    h += '<p class="q-empty">No question matches those filters. <b>Clear the status or the section</b> to widen the register, or search a document key — Greenway, JSA, LBC, Savills, Key Plans, Area Schedule, Masterplan, Brochure.</p>';
    return h;
  }

  let lastSec = null, lastSub = null;
  for (const it of shown) {
    if (it.secKey !== lastSec) {
      if (lastSec !== null) h += "</div>";
      lastSec = it.secKey; lastSub = null;
      const sec = QS_SECTIONS.find(s => s.key === it.secKey);
      const c = sec.count;
      h += '<div class="qsec"><div class="qsec-h"><h3 class="t">' + sec.name + '</h3><span class="muted" style="font-size:var(--fs-cap)">'
        + sec.half + '</span><span class="c">' + (c ? c.items + " items · " + ST_ORDER.filter(s => c.counts[s]).map(s => c.counts[s] + " " + s.toLowerCase()).join(" · ") : "") + "</span></div>";
    }
    if (it.sub && it.sub !== lastSub) { lastSub = it.sub; h += '<p class="qsub">' + esc(it.sub) + "</p>"; }
    if (it.header) { h += '<p class="q-hdr"><b>' + esc(it.n) + ".</b> " + esc(it.q) + "</p>" + md(it.body).replace(/<p>/g, '<p class="q-hdr">'); continue; }
    const open = !!QSTATE.open[it.key];
    h += '<div class="q' + (open ? " open" : "") + '" data-qkey="' + it.key + '" id="q-' + it.key + '">'
      + '<button class="q-h" aria-expanded="' + open + '">'
      + '<span class="q-n">' + esc(it.n) + "</span>"
      + '<span class="q-t">' + esc(it.q) + "</span>"
      + '<span class="q-s k-' + statusKey(it.status) + '"><i class="s-' + statusKey(it.status) + '"></i>' + it.status + "</span></button>"
      + '<div class="q-b"><div><div class="inner">' + md(it.body) + "</div></div></div></div>";
  }
  if (lastSec !== null) h += "</div>";
  h += '<p class="src">Source: ' + QS.source + ", cross-check run 16 August 2026 against the indexed data room. Every question is reproduced in its original order and wording; page and paragraph references are the source documents’ own. " + esc(QS.footer) + "</p>";
  return h;
}

function asksHTML() {
  let h = '<div class="asks">' + md([QS.askIntro]);
  for (const g of QS.askGroups) {
    h += '<div class="ask-g"><div class="gh"><span class="k">' + g.key + '</span><span class="t">' + esc(g.title)
      + '</span><span class="c">' + g.items.length + " items</span></div>"
      + g.items.map(i => '<div class="ask"><span class="n">' + i.n + '</span><span class="t">' + inline(i.text) + "</span></div>").join("") + "</div>";
  }
  h += '<p class="src">' + ASK_N + " items, every one genuinely absent from the data room, ordered by what unblocks the most work. Source: " + QS.source + ". " + esc(QS.footer) + "</p>";
  return h + "</div>";
}

function keysHTML() {
  /* the counts are the exhibit and stand side by side; the tagging convention
     is the prose beside them, held at a reading measure */
  const counts = Object.entries(QS.tables).filter(([, rows]) => rows.length).map(([name, rows]) =>
    '<div class="cs-block"><h3 class="cs-h">' + esc(name) + '</h3><div class="tbl-scroll"><table class="tbl num"><thead><tr>'
    + rows[0].map((c, i) => '<th class="' + (i ? "r" : "") + '">' + inline(c) + "</th>").join("") + "</tr></thead><tbody>"
    + rows.slice(1).map(r => {
        const tot = /\*\*/.test(r[0] || "") || /\*\*/.test(r[1] || "");
        return '<tr class="' + (tot ? "total" : "") + '">' + r.map((c, i) => '<td class="' + (i ? "r" : "") + '">' + inline(c) + "</td>").join("") + "</tr>";
      }).join("")
    + "</tbody></table></div></div>").join("");

  return '<div class="stack-lg"><div class="cs-grid">' + counts + "</div>"
    + '<div class="duo" style="--duo:minmax(0,52fr) minmax(0,48fr)">'
    + '<div class="keys-intro">' + md(QS.docIntro.split("\n\n")) + "</div>"
    + '<div><h3 class="pane-h">The reading</h3><p class="para" style="margin-top:12px">'
    + inline(QS.closing.replace(/\n/g, " ")) + "</p>"
    + '<p class="src">Source: ' + QS.source + ". " + esc(QS.footer) + "</p></div></div></div>";
}

/* ─────────────  the cheat sheet  ───────────── */

function csTable(cols, rows) {
  return '<div class="tbl-scroll wide"><table class="tbl num"><thead><tr><th></th>'
    + cols.map(c => '<th class="r">' + c + "</th>").join("") + "</tr></thead><tbody>"
    + rows.map(r => {
        const [label, vals, bold, note] = r;
        return '<tr class="' + (bold ? "total" : "") + '"><td>' + label + (note ? '<span class="ag-note">' + note + "</span>" : "") + "</td>"
          + vals.map(v => '<td class="r">' + v + "</td>").join("") + "</tr>";
      }).join("") + "</tbody></table></div>";
}

function cheatHTML() {
  const C = CHEAT;
  let h = '<div class="duo" style="--duo:minmax(0,60fr) minmax(0,40fr)">'
    + '<p class="lede">' + C.thesis + "</p>"
    + '<div><p class="src" style="border-top:0;padding-top:0;margin-top:0">' + C.meta + "</p>"
    + '<p class="src">' + C.assetLine + "</p></div></div>";

  h += '<div class="kpis four" style="margin-top:clamp(20px,2.6vw,30px)">' + C.kpis.map(([l, v]) =>
    '<div class="kpi"><div class="num">' + v + '</div><div class="cap">' + l + "</div></div>").join("") + "</div>";

  h += '<div class="sec"><div class="sec-head"><h2 class="h2">Summary P&amp;L</h2><span class="n">Align model, year 1 to stabilisation</span></div>'
    + csTable(C.operating.columns, C.operating.rows) + "</div>";

  h += '<div class="sec"><div class="sec-head"><h2 class="h2">Summary Cash Flow</h2><span class="n">£m to investor · post-promote</span></div>'
    + csTable(C.cashflow.columns, C.cashflow.rows)
    + C.cashflow.funding.map(([t, c]) => '<p class="src" style="border-top:0;padding-top:6px">' + t + " <span class='muted'>" + c + "</span></p>").join("") + "</div>";

  h += '<div class="sec"><div class="sec-head"><h2 class="h2">Sources &amp; Uses, Returns and Sensitivity</h2></div><div class="cs-grid">';
  h += '<div class="cs-block"><h3 class="cs-h">Sources &amp; uses</h3><table class="tbl num">'
    + C.su.map(r => {
        if (r[0] === "sub") return '<tr class="divider"><td colspan="2">' + r[1] + "</td></tr>";
        return '<tr class="' + (r[0] === "tot" ? "total" : "") + '"><td>' + r[1] + '</td><td class="r">' + r[2] + "</td></tr>";
      }).join("") + "</table>"
    + C.yieldLines.map(([t]) => '<p class="cs-note">' + t + "</p>").join("") + "</div>";

  h += '<div class="cs-block"><h3 class="cs-h">Returns &amp; promote</h3><table class="tbl num">'
    + C.returns.map(r => '<tr class="' + (r[3] ? "total" : "") + '"><td>' + r[0] + '</td><td class="r">' + r[1] + "</td></tr>").join("")
    + "</table></div>";

  h += '<div class="cs-block"><h3 class="cs-h">Sensitivity — investor post-promote IRR</h3>'
    + '<table class="grid3"><thead><tr><th>IRR</th>' + C.sensitivity.cols.map(c => "<th>" + c + "</th>").join("") + "</tr></thead><tbody>"
    + C.sensitivity.rows.map((rl, ri) => "<tr><th>" + rl + "</th>"
        + C.sensitivity.grid[ri].map((v, ci) => '<td class="' + (ri === C.sensitivity.base[0] && ci === C.sensitivity.base[1] ? "base" : "")
          + '">' + v + (ri === C.sensitivity.base[0] && ci === C.sensitivity.base[1] ? '<span class="t">base</span>' : "") + "</td>").join("") + "</tr>").join("")
    + "</tbody></table>"
    + '<p class="cs-note">' + C.sensitivity.caption + "</p>"
    + C.sensitivity.stress.map(([t]) => '<p class="cs-note">' + t + "</p>").join("") + "</div></div></div>";

  h += '<div class="sec"><div class="sec-head"><h2 class="h2">Competitive Position &amp; Gap</h2></div>'
    + '<p class="para">' + C.competitive.headline + "</p>"
    + '<div class="tbl-scroll"><table class="tbl num"><thead><tr>'
    + C.competitive.columns.map((c, i) => '<th class="' + (i ? "r" : "") + '">' + c + "</th>").join("") + "</tr></thead><tbody>"
    + C.competitive.rows.map(r => '<tr class="' + (r[5] ? "subject" : "") + '">'
        + r.slice(0, 5).map((c, i) => '<td class="' + (i ? "r" : "") + '">' + (c || "—") + "</td>").join("") + "</tr>").join("")
    + "</tbody></table></div>"
    + '<p class="src">' + C.competitive.caption + " " + C.competitive.notes.join(" ") + "</p>"
    + '<p class="pane-h" style="margin-top:24px">The repositioning plan and demand mix</p>'
    + '<div class="bullets" style="margin-top:14px">' + C.competitive.plan.map(([t, c]) =>
        "<div><b>" + t + '</b><span class="ag-note">' + c + "</span></div>").join("") + "</div>"
    + '<p class="src">' + C.competitive.constituents.join(" · ") + "</p></div>";

  h += '<div class="sec"><div class="sec-head"><h2 class="h2">Transaction Comps — Per-Key Evidence</h2></div>'
    + '<div class="tbl-scroll"><table class="tbl num"><thead><tr>'
    + C.comps.columns.map((c, i) => '<th class="' + (i ? "r" : "") + '">' + c + "</th>").join("") + "</tr></thead><tbody>"
    + C.comps.rows.map(r => '<tr class="' + (r[5] ? "subject" : "") + '">'
        + r.slice(0, 5).map((c, i) => '<td class="' + (i ? "r" : "") + '">' + c + "</td>").join("") + "</tr>").join("")
    + "</tbody></table></div>"
    + '<p class="src">' + C.comps.caption + " " + C.comps.captionNote + "</p></div>";

  h += '<div class="sec"><div class="sec-head"><h2 class="h2">Deal &amp; Terms</h2></div><div class="cs-grid"><div class="cs-block"><table class="tbl">'
    + C.terms.map(r => {
        if (r[0] === "sub") return '<tr class="divider"><td colspan="2">' + r[1] + "</td></tr>";
        return "<tr><td><b>" + r[1] + "</b></td><td>" + r[2] + (r[3] ? '<span class="ag-note">' + r[3] + "</span>" : "") + "</td></tr>";
      }).join("") + "</table></div>"
    + '<div class="cs-block"><h3 class="cs-h">Investor watchpoints</h3><div class="watch">'
    + C.watchpoints.map(([s, t, c]) => '<div class="watch-i"><span class="s ' + s.toLowerCase() + '">' + s + '</span><span class="t">' + t
        + '</span><span class="c">' + c + "</span></div>").join("") + "</div></div></div></div>";

  h += C.footer.map(f => '<p class="src">' + f + "</p>").join("");
  return h;
}

/* ─────────────  shared furniture  ───────────── */

function contactHTML() {
  return '<div class="contact"><div class="name">Chris King</div>'
    + '<div class="role">Managing Director, Align Partners</div>'
    + '<div class="accent">chris.king@alignpartners.co.uk</div>'
    + '<div class="muted">Preliminary analysis, subject to confirmatory due diligence</div></div>';
}

function footHTML() {
  return '<footer class="foot"><span class="t">Strictly Private &amp; Confidential</span>'
    + '<span class="d">Preliminary — subject to confirmatory DD</span>'
    + '<img src="align-mark.png" alt="Align" width="600" height="145"></footer>';
}

/* the argument, folded behind a rule: prose left, sources right */
function reasonHTML(main, side, label, count) {
  if (!main.length && !side.length) return "";
  const only = !main.length;   /* sources alone set as footnote columns, never as a ribbon */
  return '<details class="reason"><summary><span class="gl">›</span>' + (label || "Reasoning &amp; basis")
    + (count ? '<span class="ct">' + count + "</span>" : "") + "</summary>"
    + '<div class="reason-b' + (only ? " only-src" : "") + '">'
    + (only ? "" : '<div class="rb-main stack">' + main.map(blockHTML).join("") + "</div>")
    + '<div class="rb-side">' + side.map(blockHTML).join("") + "</div></div></details>";
}

function viewReason(v) {
  const side = v.reason.filter(b => b[0] === "src");
  const main = v.reason.filter(b => b[0] !== "src");
  if (!main.length && !side.length) return "";
  const label = main.length ? "Reasoning &amp; basis" : "Basis and sources";
  return reasonHTML(main, side, label, "");
}

function tabsHTML(items, current, hashOf) {
  if (items.length < 2) return "";
  return '<nav class="tabs" aria-label="Views in this chapter">' + items.map(v =>
    '<a class="tab" href="' + hashOf(v) + '" aria-current="' + (v.id === current ? "true" : "false") + '">'
    + v.title + "</a>").join("") + "</nav>";
}

function pagerHTML(prev, next) {
  const btn = (c, side) => c
    ? '<button class="' + (side === "r" ? "r" : "") + '" data-ch="' + c.id + '"><span class="pg-l">' + (side === "r" ? "Next ›" : "‹ Previous")
      + '</span><span class="nm">' + c.title + "</span></button>"
    : '<button class="' + (side === "r" ? "r" : "") + '" data-route="index"><span class="pg-l">' + (side === "r" ? "Back ›" : "‹ Back")
      + '</span><span class="nm">Contents</span></button>';
  return '<nav class="pager">' + btn(prev, "l") + btn(next, "r") + "</nav>";
}

/* ─────────────  a chapter, and its views  ───────────── */

function viewChapter(ch, v) {
  const prev = CHAPTERS[ch.i - 1], next = CHAPTERS[ch.i + 1];
  const overview = v.id === "", multi = ch.views.length > 1;
  const head = '<header class="st" style="--i:0"><p class="eyebrow">Chapter ' + ch.num + " · " + ch.eyebrow + "</p>"
    + '<div class="vhead"><h1 class="h-display">' + (overview ? ch.title : v.title) + "</h1>"
    + '<span class="fig">' + v.figure + "</span></div>"
    /* the chapter line introduces the hub; a single-view chapter has its own standfirst */
    + (overview && multi ? '<p class="lede hub-lede" style="margin-top:12px">' + ch.blurb + "</p>" : "") + "</header>";

  const body = '<div class="stack-lg">' + v.lead.map(blockHTML).join("") + "</div>" + viewReason(v);

  /* the register and the cheat sheet fill their own view; their tab strip is
     the index, and a list under 1,500 nodes of register would never be read */
  const longLead = v.lead.some(b => b[0] === "qs" || b[0] === "cheat");
  const index = overview && multi && !longLead
    ? '<section class="sec st" style="--i:3"><div class="vidx"><div class="vidx-h"><span class="t">In this chapter</span></div>'
      + ch.views.slice(1).map(x =>
          '<button class="vrow" data-ch="' + ch.id + '" data-view="' + x.id + '"><span><span class="t">' + x.title
          + '<span class="gl">›</span></span><span class="d">' + x.blurb + "</span></span>"
          + '<span class="f">' + x.figure + "</span></button>").join("")
      + "</div></section>"
    : "";

  /* with no tab strip between them, the head needs its own air */
  const gap = multi ? "" : "margin-top:clamp(20px,2.8vw,34px);";
  return '<article class="view wrap">' + head
    + tabsHTML(ch.views, v.id, x => "#/c/" + ch.id + (x.id ? "/" + x.id : ""))
    + '<div class="st" style="--i:2;' + gap + '">' + body + "</div>" + index
    + pagerHTML(prev, next) + footHTML() + "</article>";
}

const sheet = $("#sheet"), tocbtn = $("#tocbtn"), dialbtn = $("#dialbtn"), sheetinner = $("#sheetinner");

  if (restoreFocus && mode) (mode === "toc" ? tocbtn : dialbtn).focus();

/* ─────────────  the finder  ───────────── */

/* One index over everything the portal holds: chapters and their views, the
   ten cases and their estimated P&Ls, all 87 questions, the 39 asks, the
   sixteen dials, the entry ladder, the bridge levers and the watchpoints.
   Built once, on the first keystroke. */
let FIND_IX = null;

/* every string a block holds, so a search reaches into the tables themselves —
   "EFG" has to find the charge on the title page, not just a section name */
const BLOCK_KINDS = new Set(["lede", "para", "subhead", "src", "kpis", "tbl", "cards", "bullets",
  "panes", "exhibit", "plates", "strip", "rate", "ladder", "cases", "dials16", "wf", "bridge",
  "read", "qs", "asks", "keys", "cheat", "pnlcomp", "contact", "left", "right", "labeled", "num",
  "num wide", "wide", "subject", "total", "key", "divider", "note", "r", "c", "q", "subtotal"]);
function harvest(v, out) {
  if (typeof v === "string") { if (v.length > 3 && !BLOCK_KINDS.has(v)) out.push(plain(v)); return; }
  if (Array.isArray(v)) { for (const x of v) harvest(x, out); return; }
  if (v && typeof v === "object") { for (const x of Object.values(v)) harvest(x, out); }
}
const textOf = v => { const out = []; harvest(v, out); return out.join(" "); };

function findIndex() {
  if (FIND_IX) return FIND_IX;
  const ix = [];
  const add = (kind, label, meta, hash, body, extra) => {
    const raw = plain(label) + " " + (meta || "") + (body ? " " + body : "");
    ix.push(Object.assign({ kind, label, meta: meta || "", hash, raw, hay: raw.toLowerCase() }, extra || {}));
  };

  for (const c of CHAPTERS) {
    add("Chapter", c.title, c.blurb, "#/c/" + c.id, textOf(c.views[0]));
    for (const v of c.views.slice(1)) add("Section", v.title, plain(c.title) + " — " + v.blurb,
      "#/c/" + c.id + "/" + v.id, textOf(v));
  }
  for (const c of CASES) {
    add("Case study", c.name, plain(c.meta) + " · " + c.layer, "#/h/" + c.slug,
      textOf([c.record, c.cards, c.against, c.gap || "", c.src]));
    const p = PNL_BY_CASE[c.slug];
    if (p) add("Estimated P&L", c.name + " — estimated P&L",
      (p.evidence_class === "CALIBRATED" ? "Calibrated to filed accounts" : "Estimated, outside-in")
      + " · " + p.basis_year + " · GOP " + PNLFMT.pct(p.margins.gop), "#/h/" + c.slug + "/pnl",
      p.entity + " " + p.filed_evidence + " " + textOf(PNL_NOTES[p.slug] || []));
  }
  for (const it of QS_ITEMS) {
    if (it.header) continue;
    add("Question", it.q, it.section + " · " + it.status, "#/c/dd",
      (it.statusLine || "") + " " + it.body.join(" "), { qkey: it.key });
  }
  for (const g of QS.askGroups) for (const i of g.items) add("Ask", plain(inline(i.text)), g.title, "#/c/dd/asks");
  for (const [k, v] of DIALS) add("Dial", k, plain(v), "#/c/underwrite");
  for (const r of LADDER.rows) add("Entry", r.e + " entry — " + r.irr, r.note, "#/c/returns");
  for (const r of BRIDGE.rows) add("Bridge lever", r.lever, "Levered IRR " + r.irr + (r.d ? " · " + r.d + "pp" : ""), "#/c/bridge");
  for (const [s, t, c] of CHEAT.watchpoints) add("Watchpoint", t, s + " · " + c, "#/c/cheatsheet");
  for (const [l, v] of CHEAT.kpis) add("Figure", l + " — " + v, "The cheat sheet", "#/c/cheatsheet");
  /* the cheat sheet's own tables answer to a search too */
  const cs = ix.find(e => e.kind === "Chapter" && e.hash === "#/c/cheatsheet");
  if (cs) { cs.raw += " " + textOf(CHEAT); cs.hay = cs.raw.toLowerCase(); }
  FIND_IX = ix;
  return ix;
}

function findRun(qRaw) {
  const q = qRaw.trim().toLowerCase();
  if (q.length < 2) return null;
  const terms = q.split(/\s+/);
  const out = [];
  for (const e of findIndex()) {
    if (!terms.every(t => e.hay.includes(t))) continue;
    const l = e.label.toLowerCase();
    e._r = l.startsWith(terms[0]) ? 0 : l.includes(q) ? 1 : 2;
    out.push(e);
  }
  out.sort((a, b) => a._r - b._r
    || KIND_ORDER.indexOf(a.kind) - KIND_ORDER.indexOf(b.kind)
    || a.label.length - b.label.length);
  return out;
}

const KIND_ORDER = ["Chapter", "Section", "Case study", "Estimated P&L", "Question", "Ask", "Dial", "Entry", "Bridge lever", "Watchpoint", "Figure"];

function mark(text, q) {
  const i = text.toLowerCase().indexOf(q.trim().toLowerCase().split(/\s+/)[0]);
  if (i < 0) return esc(text);
  const n = q.trim().split(/\s+/)[0].length;
  return esc(text.slice(0, i)) + "<mark>" + esc(text.slice(i, i + n)) + "</mark>" + esc(text.slice(i + n));
}

const FIND_EG = ["parking", "Reschio", "occupancy", "EFG", "exit yield", "asbestos", "GOP margin"];

/* what to show under a hit: its own description, or the phrase it matched on */
function hitLine(e, q) {
  const term = q.trim().toLowerCase().split(/\s+/)[0];
  const meta = e.meta || "";
  if (meta.toLowerCase().includes(term) || e.label.toLowerCase().includes(term))
    return meta.length > 190 ? meta.slice(0, 190) + "…" : meta;
  const i = e.hay.indexOf(term);
  if (i < 0) return meta.length > 190 ? meta.slice(0, 190) + "…" : meta;
  const a = Math.max(0, i - 80), b = Math.min(e.raw.length, i + 110);
  return (a ? "…" : "") + e.raw.slice(a, b).trim() + (b < e.raw.length ? "…" : "");
}

function findRender(q) {
  const box = $("#findresults");
  const res = findRun(q);
  if (res === null) {
    box.innerHTML = '<p class="find-hint">Type to search <b>' + QS.totalItems + " questions</b>, the ten case studies and their estimated P&amp;Ls, every section of the portal, the sixteen dials, the entry ladder, the bridge levers and the watchpoints.</p>"
      + '<div class="find-eg">' + FIND_EG.map(e => '<button data-eg="' + e + '">' + e + "</button>").join("") + "</div>";
    return;
  }
  if (!res.length) {
    box.innerHTML = '<p class="find-hint">Nothing matches <b>' + esc(q.trim()) + "</b>. The register answers to a document key — Greenway, LBC, Savills, Key Plans, Masterplan — and the case studies to a property name.</p>"
      + '<div class="find-eg">' + FIND_EG.map(e => '<button data-eg="' + e + '">' + e + "</button>").join("") + "</div>";
    return;
  }
  const shown = res.slice(0, 40);
  box.innerHTML = '<p class="find-count"><b>' + res.length + "</b> match" + (res.length === 1 ? "" : "es")
    + (res.length > shown.length ? " · the first " + shown.length + " shown" : "") + "</p>"
    + shown.map((e, i) => '<button class="hit" data-hash="' + e.hash + '"'
        + (e.qkey ? ' data-qkey="' + e.qkey + '"' : "") + ">"
        + '<span class="t">' + mark(e.label, q) + "</span>"
        + '<span class="k">' + e.kind + "</span>"
        + '<span class="d">' + esc(hitLine(e, q)) + "</span>"
        + "</button>").join("");
}

const findEl = $("#find"), findInput = $("#findinput");
let findLast = null;
function openFind(seed) {
  findLast = document.activeElement;
  findEl.classList.add("on"); findEl.inert = false;
  document.body.classList.add("find-open");
  view.inert = true;
  findInput.value = seed || "";
  findRender(findInput.value);
  findInput.focus(); findInput.select();
}
function closeFind() {
  findEl.classList.remove("on"); findEl.inert = true;
  document.body.classList.remove("find-open");
  view.inert = false;
  findLast?.focus?.(); findLast = null;
}
$("#findbtn").addEventListener("click", () => openFind(""));
$("#findx").addEventListener("click", closeFind);
findInput.addEventListener("input", () => findRender(findInput.value));

/* ─────────────  router  ───────────── */

let pendingQ = null;

function route() {
  const h = location.hash.replace(/^#\/?/, "");
  const parts = h.split("/").filter(Boolean);
  let html, eyebrow, back = null, backHash = "#/", chapId = null;

  if (parts[0] === "h" && BY_SLUG[parts[1]]) {
    const c = BY_SLUG[parts[1]];
    const tab = parts[2] === "pnl" ? "pnl" : "";
    html = viewCase(c, tab); chapId = "evidence";
    eyebrow = "Case studies · " + c.name + (tab ? " · estimated P&L" : "");
    back = "Comparables"; backHash = "#/c/evidence";
    document.title = c.name + " — Fawley Court";
  } else if (parts[0] === "c" && CH_BY_ID[parts[1]]) {
    const ch = CH_BY_ID[parts[1]];
    const v = viewOf(ch, parts[2]);
    chapId = ch.id;
    html = viewChapter(ch, v);
    eyebrow = "Chapter " + ch.num + " · " + plain(ch.title) + (v.id ? " · " + plain(v.title) : "");
    if (v.id) { back = plain(ch.title); backHash = "#/c/" + ch.id; } else { back = "Contents"; backHash = "#/"; }
    document.title = plain(v.id ? v.title : ch.title) + " — Fawley Court";
  } else {
    html = viewIndex(); eyebrow = "Deal portal"; chapId = null;
    document.title = "Fawley Court — Deal Portal";
  }

  view.innerHTML = html;
  $("#eyebrow").textContent = eyebrow;
  const b = $("#back");
  b.hidden = !back;
  b.dataset.hash = backHash;
  if (back) $("#backlabel").textContent = back;

  $$(".chip").forEach(el => el.setAttribute("aria-current", String(el.dataset.ch === chapId)));
  const cur = $('.chip[aria-current="true"]');
  if (cur) cur.scrollIntoView({ block: "nearest", inline: "center", behavior: "instant" });
  const curTab = $('.tab[aria-current="true"]');
  if (curTab && curTab.parentElement.scrollWidth > curTab.parentElement.clientWidth) {
    curTab.parentElement.scrollLeft = Math.max(0, curTab.offsetLeft - 24);
  }

  if (lb.classList.contains("on")) closeLB();
  closeSheet();

  window.scrollTo({ top: 0, behavior: "instant" });
  view.focus({ preventScroll: true });
  growBars();

  if (pendingQ) {
    const k = pendingQ; pendingQ = null;
    const el = document.getElementById("q-" + k);
    if (el) { el.scrollIntoView({ behavior: "instant", block: "center" }); el.querySelector(".q-h")?.focus?.(); }
  }
  if (QSTATE.q && $("#qsearch")) { const i = $("#qsearch"); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }
}

function growBars() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const bars = view.querySelectorAll(".fbar, .rankrow .b");
  const vals = view.querySelectorAll(".fval"), dias = view.querySelectorAll(".fdia");
  bars.forEach(b => {
    const w = b.dataset.w; if (w == null) return;
    b.style.width = "0%";
    requestAnimationFrame(() => requestAnimationFrame(() => { b.style.width = w + "%"; }));
  });
  [...vals, ...dias].forEach(v => { v.style.opacity = "0"; });
  setTimeout(() => [...vals, ...dias].forEach(v => { v.style.opacity = ""; }), 260);
  view.querySelectorAll(".lad .b").forEach(el => {
    const w = el.style.width; el.style.width = "0%";
    requestAnimationFrame(() => requestAnimationFrame(() => { el.style.width = w; }));
  });
}

function go(hash) { if (location.hash === hash) route(); else location.hash = hash; }

/* ─────────────  delegated interaction  ───────────── */

document.addEventListener("click", e => {
  const t = e.target;

  const hit = t.closest("[data-hash]");
  if (hit) {
    closeFind();
    if (hit.dataset.qkey) {
      QSTATE.status = null; QSTATE.section = null; QSTATE.q = "";
      QSTATE.open[hit.dataset.qkey] = true; pendingQ = hit.dataset.qkey;
    }
    go(hit.dataset.hash);
    return;
  }
  const eg = t.closest("[data-eg]");
  if (eg) { findInput.value = eg.dataset.eg; findRender(findInput.value); findInput.focus(); return; }
  if (t.closest("#findbar")) { openFind(""); return; }

  const chEl = t.closest("[data-ch]");
  if (chEl) { go("#/c/" + chEl.dataset.ch + (chEl.dataset.view ? "/" + chEl.dataset.view : "")); return; }
  const slugEl = t.closest("[data-slug]");
  if (slugEl) { go("#/h/" + slugEl.dataset.slug + (slugEl.dataset.view ? "/" + slugEl.dataset.view : "")); return; }
  const rt = t.closest("[data-route]");
  if (rt) { go("#/"); return; }
  const pl = t.closest("[data-plate]");
  if (pl) { openLB(+pl.dataset.plate); return; }
  const lad = t.closest("[data-lad]");
  if (lad) {
    $$(".lad").forEach(x => x.setAttribute("aria-current", "false"));
    lad.setAttribute("aria-current", "true");
    ladDetail(+lad.dataset.lad);
    return;
  }
  const tt = t.closest("#tbltoggle");
  if (tt) {
    const w = $("#tblwrap"), on = w.hidden;
    w.hidden = !on;
    if (on && !w.innerHTML) w.innerHTML = fieldTable();
    tt.firstElementChild.textContent = on ? "Hide the table" : "Show as a table";
    tt.setAttribute("aria-expanded", String(on));
    return;
  }
  const anchorA = t.closest('a[href^="#"]:not([href^="#/"])');
  if (anchorA) {
    e.preventDefault();
    const id = anchorA.getAttribute("href").slice(1);
    const el = document.getElementById(id);
    if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
    return;
  }
  /* the register */
  const st = t.closest("[data-qstatus]");
  if (st) { QSTATE.status = st.dataset.qstatus || null; rerenderQs(); return; }
  const sc = t.closest("[data-qsec]");
  if (sc) { QSTATE.section = sc.dataset.qsec || null; rerenderQs(); return; }
  if (t.closest("#qclear")) { QSTATE.status = null; QSTATE.section = null; QSTATE.q = ""; rerenderQs(); return; }
  const qh = t.closest(".q-h");
  if (qh) {
    const q = qh.parentElement, k = q.dataset.qkey;
    const open = !q.classList.contains("open");
    q.classList.toggle("open", open);
    qh.setAttribute("aria-expanded", String(open));
    QSTATE.open[k] = open;
    return;
  }
});

function rerenderQs() {
  const target = $("#register");
  if (!target) return;
  const y = window.scrollY;
  target.innerHTML = qsInner();
  window.scrollTo({ top: y, behavior: "instant" });
  const i = $("#qsearch");
  if (i && QSTATE.q) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); }
}

let qTimer;
document.addEventListener("input", e => {
  if (e.target.id !== "qsearch") return;
  clearTimeout(qTimer);
  const v = e.target.value;
  qTimer = setTimeout(() => { QSTATE.q = v; rerenderQs(); }, 220);
});

/* rate-field readout */
function readout(i) {
  const el = $("#readout"); if (!el) return;
  if (i == null) { el.className = "freadout idle"; el.textContent = "Select a property to read its rate evidence. Five of the eleven open a case study."; return; }
  const r = FIELD.rows[i], point = r.max <= r.min;
  const v = point ? money(r.min) : money(r.min) + " to " + money(r.max) + (r.mid != null ? ", median " + money(r.mid) : "");
  el.className = "freadout";
  el.innerHTML = "<b>" + r.label + '</b> &nbsp;<span class="v">' + v + "</span>" + (r.slug ? ' &nbsp;<span class="go">Open the case ›</span>' : "");
}
document.addEventListener("pointerover", e => {
  const r = e.target.closest(".frow"); if (r) readout(+r.dataset.i);
  const b = e.target.closest(".wfbar"); if (b) wfRead(b);
});
document.addEventListener("pointerout", e => {
  const r = e.target.closest(".frow");
  if (r && !e.relatedTarget?.closest?.(".frow")) readout(null);
});
document.addEventListener("focusin", e => {
  const r = e.target.closest(".frow"); if (r) readout(+r.dataset.i);
  const b = e.target.closest(".wfbar"); if (b) wfRead(b);
});
function wfRead(bar) {
  const box = bar.closest(".wf")?.querySelector(".wf-read");
  if (!box) return;
  box.className = "wf-read";
  box.innerHTML = bar.dataset.tip;
}

/* ─────────────  the lightbox  ───────────── */

const lb = $("#lb"); let lbi = 0, lastFocus = null;
function openLB(i) {
  lbi = (i + PLATES.length) % PLATES.length;
  const p = PLATES[lbi];
  $("#lbimg").src = "img/" + p.f + ".jpg";
  $("#lbimg").alt = p.alt;
  $("#lbcap").textContent = p.cap;
  $("#lbsrc").textContent = "Vendor data room";
  if (!lb.classList.contains("on")) {
    lastFocus = document.activeElement;
    view.inert = true;
    lb.classList.add("on"); document.body.classList.add("lb-open");
    $("#lbx").focus();
  }
}
function closeLB() { lb.classList.remove("on"); document.body.classList.remove("lb-open"); view.inert = false; lastFocus?.focus?.(); lastFocus = null; }
$("#lbx").addEventListener("click", closeLB);
$("#lbprev").addEventListener("click", () => openLB(lbi - 1));
$("#lbnext").addEventListener("click", () => openLB(lbi + 1));
$(".lb-im").addEventListener("click", closeLB);

document.addEventListener("keydown", e => {
  if (lb.classList.contains("on")) {
    if (e.key === "Escape") closeLB();
    if (e.key === "ArrowLeft") openLB(lbi - 1);
    if (e.key === "ArrowRight") openLB(lbi + 1);
    return;
  }
  if (findEl.classList.contains("on")) {
    if (e.key === "Escape") closeFind();
    return;
  }
  if (e.key === "Escape" && sheetMode) { closeSheet(true); return; }
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName || "");
  if (!typing && (e.key === "/" || ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k"))) {
    e.preventDefault(); openFind("");
  }
});

/* ─────────────  boot  ───────────── */

$("#back").addEventListener("click", e => go(e.currentTarget.dataset.hash || "#/"));

buildChips();
window.addEventListener("hashchange", route);
route();

let lastStep = domStep(), rt;
window.addEventListener("resize", () => {
  clearTimeout(rt);
  rt = setTimeout(() => {
    if (domStep() !== lastStep) { lastStep = domStep(); if (view.querySelector(".fieldbox")) route(); }
  }, 180);
});

if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1")) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}

/* Warm the full-size plates into the cache once the page is settled, so the
   photography is there on a dead connection. Idle, non-blocking, best-effort. */
window.addEventListener("load", () => {
  const warm = () => PLATES.forEach((p, i) => setTimeout(() => fetch("img/" + p.f + ".jpg").catch(() => {}), i * 400));
  if ("requestIdleCallback" in window) requestIdleCallback(warm, { timeout: 6000 });
  else setTimeout(warm, 4000);
});
</script>
