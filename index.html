<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fawley Court">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#fcfcfb">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Fawley Court — the deal portal. Align Partners, August 2026. Strictly private and confidential.">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<title>Fawley Court — Deal Portal</title>
<style>
/* ══════════════════════════════════════════════════════════════════════
   Fawley Court — the deal portal
   Align Partners, August 2026.

   The identity is the memorandum's own dense theme, re-seated for an
   instrument rather than a document: every surface leads with the thing
   itself — table, ladder, chart, register — and the argument folds behind a
   rule. No web font is loaded: the portal must open with no network.
   ══════════════════════════════════════════════════════════════════════ */

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

:root {
  color-scheme: light;

  --accent: #1e3a5f;
  --accent-ink: #ffffff;
  --accent-tint: #eef1f5;
  --accent-tint-2: #e3e9f0;
  --paper: #fcfcfb;
  --surface-2: #f4f4f2;
  --surface-3: #ecece9;
  --ink: #1a1a1a;
  --muted: #666666;
  --muted-2: #6f6f6b;
  --line: #e2e2df;
  --line-mid: rgba(0,0,0,.18);
  --line-strong: #333333;

  /* chart marks — validated: navy / rust separate at ΔE 28 normal, 15.9 protan;
     the ordinal navy steps separate at ΔE ≥ 15.7 and carry direct labels. */
  --chart-muted: #828f9e;
  --chart-2: #5a7896;
  --chart-3: #93a6b8;
  --neg: #b3402e;
  --neg-tint: #f7edeb;
  --charcoal: #2b2b2b;

  --font: 'Arial Nova', 'Helvetica Neue', Helvetica, Arial, sans-serif;

  --fs-display: clamp(1.62rem, 1.2rem + 1.5vw, 2.25rem);
  --fs-h2: clamp(1.0625rem, 0.98rem + 0.4vw, 1.32rem);
  --fs-h3: 0.9375rem;
  --fs-body: clamp(0.9rem, 0.87rem + 0.14vw, 0.96rem);
  --fs-sm: 0.85rem;
  --fs-cap: 0.75rem;
  --fs-micro: 0.725rem;

  --lh: 1.5;
  --lh-relaxed: 1.62;
  --lh-tight: 1.15;

  --pad-x: clamp(18px, 4.2vw, 56px);
  --maxw: 1360px;
  --radius: 3px;

  --ease: cubic-bezier(.16, 1, .3, 1);
  --ease-out: cubic-bezier(.22, .8, .3, 1);

  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
  --safe-r: env(safe-area-inset-right, 0px);

  --mast-h: 52px;
  --bar-h: 56px;
  --tabs-h: 47px;

  /* the rate field's shared geometry */
  --flabel-w: clamp(132px, 20vw, 224px);
  --fgap: 18px;
  --fpad-r: 58px;
}

@media (max-width: 640px) {
  :root {
    --flabel-w: 0px; --fgap: 0px; --fpad-r: 44px;
    --fs-body: 0.95rem;
    --fs-sm: 0.875rem;
    --fs-cap: 0.75rem;
  }
}

html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
* { scroll-margin-top: calc(var(--mast-h) + var(--tabs-h) + var(--safe-t) + 16px); }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }

body {
  font-family: var(--font);
  font-size: var(--fs-body);
  line-height: var(--lh);
  color: var(--ink);
  background: var(--paper);
  overflow-x: hidden;
  overscroll-behavior-y: none;
  padding-top: calc(var(--mast-h) + var(--safe-t));
  padding-bottom: calc(var(--bar-h) + var(--safe-b));
}

:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 2px; }
#view:focus-visible { outline: 0; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
a { color: var(--accent); text-decoration: none; }
img { display: block; max-width: 100%; }
code { font-family: 'SF Mono', ui-monospace, Menlo, Consolas, monospace; font-size: .9em; background: var(--surface-2); padding: 1px 4px; border-radius: 2px; }

.wrap { max-width: var(--maxw); margin: 0 auto; padding-left: max(var(--pad-x), var(--safe-l)); padding-right: max(var(--pad-x), var(--safe-r)); }

/* ─────────────────────────  masthead  ───────────────────────── */

.mast {
  position: fixed; top: 0; left: 0; right: 0; z-index: 60;
  height: calc(var(--mast-h) + var(--safe-t));
  padding-top: var(--safe-t);
  background: rgba(252,252,251,.94);
  backdrop-filter: saturate(140%) blur(8px);
  -webkit-backdrop-filter: saturate(140%) blur(8px);
  border-bottom: 1px solid var(--line-strong);
}
.mast-in { height: var(--mast-h); display: flex; align-items: center; gap: 10px; }
.mast-back {
  display: inline-flex; align-items: center; gap: 7px; min-height: 44px;
  font-size: var(--fs-cap); letter-spacing: .09em; text-transform: uppercase;
  color: var(--ink); padding: 0 10px 0 0; margin-left: -2px; flex: none;
  transition: color .2s var(--ease-out);
}
.mast-back:hover, .mast-back:focus-visible { color: var(--accent); }
.mast-back[hidden] { display: none; }
.mast-back .gl { font-size: .9rem; line-height: 1; transform: translateY(-.5px); transition: transform .3s var(--ease); }
.mast-back:hover .gl, .mast-back:focus-visible .gl { transform: translate(-3px, -.5px); }
.mast-eyebrow { font-size: var(--fs-cap); color: var(--muted); letter-spacing: .02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.mast-brand { margin-left: auto; display: flex; align-items: center; gap: 10px; flex: none; }
.mast-brand .nm { font-size: var(--fs-cap); text-transform: uppercase; letter-spacing: .2em; color: var(--ink); white-space: nowrap; }
.mast-brand img { height: 15px; width: auto; opacity: .72; }
@media (max-width: 760px) { .mast-brand .nm { display: none; } }
.mast-find {
  flex: none; width: 44px; height: 44px; display: grid; place-items: center; margin-left: auto;
  color: var(--ink); font-size: 1.02rem; border: 1px solid transparent; border-radius: 2px;
  transition: background .2s var(--ease-out), border-color .2s var(--ease-out), color .2s var(--ease-out);
}
.mast-find:hover, .mast-find:focus-visible { color: var(--accent); background: var(--accent-tint); border-color: var(--line-mid); }
.mast-find + .mast-brand { margin-left: 4px; }

/* ─────────────────────────  the chapter bar  ───────────────────────── */

.bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 70;
  background: rgba(252,252,251,.96);
  backdrop-filter: saturate(140%) blur(8px);
  -webkit-backdrop-filter: saturate(140%) blur(8px);
  border-top: 1px solid var(--line-strong);
  padding-bottom: var(--safe-b);
}
.bar-in { height: var(--bar-h); display: flex; align-items: stretch; gap: 0; max-width: var(--maxw); margin: 0 auto; }
.bar-btn {
  display: inline-flex; align-items: center; gap: 8px; flex: none;
  padding: 0 clamp(12px, 2vw, 18px); min-height: 44px;
  font-size: var(--fs-cap); letter-spacing: .1em; text-transform: uppercase; color: var(--ink);
  transition: background .2s var(--ease-out), color .2s var(--ease-out);
}
.bar-btn:first-child { padding-left: max(var(--pad-x), var(--safe-l)); }
.bar-btn:last-child { padding-right: max(var(--pad-x), var(--safe-r)); border-left: 1px solid var(--line); }
.bar-btn:hover, .bar-btn:focus-visible { color: var(--accent); background: var(--accent-tint); }
.bar-btn .gl { font-size: .95rem; line-height: 1; color: var(--muted); transition: transform .4s var(--ease); }
.bar-btn[aria-expanded="true"] .gl { transform: rotate(180deg); }
@media (max-width: 560px) { .bar-btn .tx { display: none; } .bar-btn { gap: 0; min-width: 52px; justify-content: center; } }

.chips {
  flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: 2px;
  overflow-x: auto; overflow-y: hidden; scrollbar-width: none;
  -webkit-overflow-scrolling: touch; scroll-snap-type: x proximity;
  border-left: 1px solid var(--line);
}
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; scroll-snap-align: center;
  display: inline-flex; align-items: center; gap: 7px; height: 100%; min-height: 44px;
  padding: 0 clamp(11px, 1.5vw, 16px); white-space: nowrap;
  font-size: var(--fs-sm); color: var(--muted);
  border-bottom: 2px solid transparent;
  transition: color .2s var(--ease-out), background .2s var(--ease-out), border-color .2s var(--ease-out);
}
.chip .n { font-size: var(--fs-micro); color: var(--muted-2); font-variant-numeric: tabular-nums; letter-spacing: .04em; }
.chip:hover, .chip:focus-visible { color: var(--accent); background: var(--accent-tint); }
.chip[aria-current="true"] { color: var(--accent); font-weight: 700; border-bottom-color: var(--accent); }

/* ─────────────────────────  the sheets  ───────────────────────── */

.sheet {
  position: fixed; left: 0; right: 0; bottom: calc(var(--bar-h) + var(--safe-b)); z-index: 65;
  background: var(--paper); border-top: 1px solid transparent;
  display: grid; grid-template-rows: 0fr;
  transition: grid-template-rows .44s var(--ease);
}
.sheet.open { grid-template-rows: 1fr; border-top-color: var(--line-strong); }
.sheet-body { overflow: hidden; }
.sheet-inner {
  max-height: min(66vh, 560px); overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding-top: clamp(16px, 2.4vw, 26px); padding-bottom: clamp(18px, 2.6vw, 30px);
}
.toc { columns: 250px 3; column-gap: clamp(20px, 3vw, 44px); }
.toc-ch { break-inside: avoid; border-top: 1px solid var(--line-strong); padding: 0 0 14px; }
.toc-ch > .h { display: flex; align-items: baseline; gap: 9px; width: 100%; text-align: left; padding: 11px 0 8px; min-height: 44px; transition: color .2s var(--ease-out); }
.toc-ch > .h:hover, .toc-ch > .h:focus-visible { color: var(--accent); }
.toc-ch > .h .n { font-size: var(--fs-micro); color: var(--muted-2); font-variant-numeric: tabular-nums; flex: none; letter-spacing: .06em; }
.toc-ch > .h .t { font-size: var(--fs-h3); font-weight: 700; line-height: 1.25; }
.toc-sub { display: grid; }
.toc-sub button { text-align: left; font-size: var(--fs-sm); color: var(--muted); padding: 10px 0 10px 26px; min-height: 44px; line-height: 1.35; transition: color .2s var(--ease-out), padding .25s var(--ease); }
.toc-sub button:hover, .toc-sub button:focus-visible { color: var(--accent); padding-left: 30px; }
.dials { margin-top: 8px; }
.dial-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 0 clamp(22px, 3vw, 44px); }
.dial-row { display: grid; grid-template-columns: minmax(96px, 32%) 1fr; gap: 14px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: var(--fs-sm); line-height: var(--lh-relaxed); }
.dial-row .k { font-weight: 700; }
.dial-row .v .n { color: var(--accent); font-weight: 700; font-variant-numeric: tabular-nums; }

/* ─────────────────────────  the finder  ───────────────────────── */

.find {
  position: fixed; inset: 0; z-index: 90; display: grid; grid-template-rows: auto minmax(0, 1fr);
  background: rgba(252,252,251,.988);
  backdrop-filter: saturate(140%) blur(14px); -webkit-backdrop-filter: saturate(140%) blur(14px);
  opacity: 0; pointer-events: none; transition: opacity .26s var(--ease-out);
}
.find.on { opacity: 1; pointer-events: auto; }
body.find-open { overflow: hidden; }
.find-top { border-bottom: 1px solid var(--line-strong); padding-top: calc(10px + var(--safe-t)); padding-bottom: 10px; }
.find-in { display: flex; align-items: center; gap: 12px; }
.find-in .gl { font-size: 1.1rem; color: var(--muted-2); flex: none; }
.find-in input {
  flex: 1; min-width: 0; border: 0; outline: 0; background: none; padding: 0; min-height: 48px;
  font: inherit; font-size: clamp(1.02rem, .96rem + .4vw, 1.24rem); color: var(--ink); letter-spacing: -.01em;
}
.find-in input::placeholder { color: var(--muted-2); }
.find-x { flex: none; min-height: 44px; padding: 0 10px; font-size: var(--fs-cap); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.find-x:hover, .find-x:focus-visible { color: var(--accent); }
.find-body { overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: calc(40px + var(--safe-b)); }
.find-hint { font-size: var(--fs-sm); color: var(--muted); line-height: var(--lh-relaxed); padding: 20px 0 4px; max-width: 62ch; }
.find-hint b { color: var(--ink); }
.find-eg { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.find-eg button {
  min-height: 44px; padding: 9px 13px; font-size: var(--fs-sm); color: var(--ink);
  border: 1px solid var(--line-mid); border-radius: 2px; background: var(--paper);
  transition: border-color .2s var(--ease-out), color .2s var(--ease-out), background .2s var(--ease-out);
}
.find-eg button:hover, .find-eg button:focus-visible { border-color: var(--accent); color: var(--accent); background: var(--accent-tint); }
.find-count { font-size: var(--fs-cap); color: var(--muted); padding: 16px 0 7px; border-bottom: 1px solid var(--line-strong); }
.find-count b { color: var(--ink); }
.hit {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px clamp(14px, 2vw, 26px); align-items: baseline;
  width: 100%; text-align: left; padding: 12px 0; min-height: 52px; border-bottom: 1px solid var(--line);
  transition: background .2s var(--ease-out);
}
.hit:hover, .hit:focus-visible { background: var(--accent-tint); }
.hit .t { font-size: var(--fs-body); line-height: 1.4; }
.hit .t mark { background: var(--accent-tint-2); color: var(--accent); font-weight: 700; padding: 0 1px; }
.hit .k { font-size: var(--fs-micro); letter-spacing: .12em; text-transform: uppercase; color: var(--muted-2); white-space: nowrap; }
.hit .d { grid-column: 1 / -1; font-size: var(--fs-cap); color: var(--muted); line-height: 1.5; max-width: none; padding-right: clamp(0px, 6vw, 90px); }

/* ─────────────────────────  view + motion  ───────────────────────── */

main { display: block; }
.view { padding-top: clamp(18px, 2.6vw, 32px); padding-bottom: clamp(22px, 3vw, 38px); }

@keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.st { opacity: 0; animation: rise .55s var(--ease) forwards; animation-delay: calc(var(--i, 0) * 34ms); }
.st-f { opacity: 0; animation: fade .7s var(--ease-out) forwards; animation-delay: calc(var(--i, 0) * 34ms); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-delay: 0ms !important; transition-duration: .001ms !important; }
  .st, .st-f { opacity: 1; }
}

/* ─────────────────────────  page furniture  ───────────────────────── */

.eyebrow { font-size: var(--fs-cap); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.h-display { font-size: var(--fs-display); font-weight: 400; letter-spacing: -.022em; line-height: var(--lh-tight); color: var(--ink); margin-top: 8px; }
.h2 { font-size: var(--fs-h2); font-weight: 700; letter-spacing: -.008em; line-height: 1.25; }
.h3 { font-size: var(--fs-h3); font-weight: 700; }
.lede { font-size: clamp(.9375rem, .89rem + .22vw, 1.0625rem); line-height: var(--lh-relaxed); color: var(--ink); max-width: 68ch; }
.lede.hub-lede { max-width: 82ch; }
.muted { color: var(--muted); }

.sec-head { display: flex; align-items: baseline; gap: 14px; padding-bottom: 8px; border-bottom: 1px solid var(--line-strong); }
.sec-head .n { font-size: var(--fs-cap); color: var(--muted); font-variant-numeric: tabular-nums; margin-left: auto; letter-spacing: .06em; text-align: right; }
.sec { margin-top: clamp(28px, 3.6vw, 48px); }
.sec:first-of-type { margin-top: 0; }

.src { font-size: var(--fs-cap); line-height: 1.62; color: var(--muted); border-top: 1px solid var(--line); padding-top: 10px; max-width: 92ch; margin-top: clamp(14px, 1.8vw, 20px); }
.src b { font-weight: 700; color: var(--muted); }
.src:first-child { margin-top: 0; }

.badge {
  display: inline-flex; align-items: center; gap: 7px; font-size: var(--fs-cap); letter-spacing: .13em; text-transform: uppercase;
  color: var(--accent); border: 1px solid var(--line-mid); padding: 4px 9px; border-radius: 2px;
  background: var(--accent-tint); white-space: nowrap;
}

/* ─────────────────────────  the view head + tab strip  ───────────────────────── */

.vhead { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 24px; align-items: end; }
.vhead .fig { text-align: right; font-size: var(--fs-sm); color: var(--accent); font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
@media (max-width: 620px) { .vhead { grid-template-columns: 1fr; } .vhead .fig { text-align: left; } }

.tabs {
  position: sticky; top: calc(var(--mast-h) + var(--safe-t)); z-index: 40;
  display: flex; gap: 0; overflow-x: auto; scrollbar-width: none;
  background: var(--paper); border-bottom: 1px solid var(--line-strong);
  margin: clamp(14px, 1.9vw, 22px) 0 clamp(20px, 2.6vw, 32px);
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: none; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap;
  min-height: 46px; padding: 11px clamp(11px, 1.4vw, 17px) 10px; padding-left: 0;
  font-size: var(--fs-sm); color: var(--muted); border-bottom: 2px solid transparent;
  transition: color .2s var(--ease-out), border-color .2s var(--ease-out), background .2s var(--ease-out);
}
.tab + .tab { padding-left: clamp(11px, 1.4vw, 17px); }
.tab:hover, .tab:focus-visible { color: var(--accent); }
.tab[aria-current="true"] { color: var(--accent); font-weight: 700; border-bottom-color: var(--accent); }
.tab .c { font-size: var(--fs-micro); color: var(--muted-2); font-variant-numeric: tabular-nums; }
.tab[aria-current="true"] .c { color: var(--accent); }

/* ─────────────────────────  tables  ───────────────────────── */

.tbl { width: 100%; border-collapse: collapse; font-size: var(--fs-sm); }
.tbl td, .tbl th { padding: 9px 14px 9px 0; text-align: left; vertical-align: top; line-height: var(--lh-relaxed); border-bottom: 1px solid var(--line); }
.tbl thead th { font-size: var(--fs-cap); letter-spacing: .09em; text-transform: uppercase; color: var(--muted); font-weight: 400; border-bottom: 1px solid var(--line-strong); padding-bottom: 6px; }
.tbl thead th.r, .tbl td.r { text-align: right; }
.tbl tr > *:last-child { padding-right: 0; }
.tbl thead th.c, .tbl td.c { text-align: center; }
.tbl.labeled td:first-child { font-weight: 700; width: 26%; min-width: 104px; padding-right: 18px; }
.tbl.num td:not(:first-child), .tbl.num th:not(:first-child) { font-variant-numeric: tabular-nums; }
.tbl .emph { color: var(--accent); font-weight: 700; }
.tbl .neg { color: var(--neg); }
.tbl tr.subject td { background: var(--accent-tint); font-weight: 700; }
.tbl tr.subject td:first-child { position: relative; padding-left: 11px; }
.tbl tr.subject td:first-child::before { content: ''; position: absolute; inset: 0 auto 0 0; width: 3px; background: var(--accent); }
.tbl tr.key td { background: var(--surface-2); }
.tbl tr.total td, .tbl tr.subtotal td { border-top: 1px solid var(--line-strong); font-weight: 700; }
.tbl tr.divider td { background: var(--surface-3); font-size: var(--fs-cap); letter-spacing: .09em; text-transform: uppercase; color: var(--muted); font-weight: 700; padding-top: 7px; padding-bottom: 7px; }
.tbl tr.note td { border-bottom: 0; border-top: 1px solid var(--line-strong); font-size: var(--fs-cap); color: var(--muted); line-height: 1.6; padding-top: 11px; }
.tbl tr.note td b { color: var(--ink); }
.tbl tr:last-child td { border-bottom: 0; }
.tbl-scroll {
  overflow-x: auto; -webkit-overflow-scrolling: touch; margin-top: 14px;
  overscroll-behavior-inline: contain;
}
.tbl-scroll:first-child { margin-top: 0; }
.tbl-scroll.mid > .tbl { min-width: 440px; }
.tbl-scroll.wide > .tbl { min-width: 680px; }
@media (max-width: 620px) {
  .tbl-scroll.lab { overflow-x: visible; background: none; }
  .tbl-scroll.lab > .tbl { min-width: 0; }
  .tbl.labeled, .tbl.labeled tbody, .tbl.labeled tr, .tbl.labeled td { display: block; width: auto; }
  .tbl.labeled tr { border-bottom: 1px solid var(--line); padding: 11px 0; }
  .tbl.labeled tr:last-child { border-bottom: 0; }
  .tbl.labeled td { border: 0; padding: 0; }
  .tbl.labeled td:first-child {
    width: auto; min-width: 0; padding: 0 0 3px; font-weight: 400;
    font-size: var(--fs-cap); letter-spacing: .1em; text-transform: uppercase; color: var(--muted);
  }
}

/* ─────────────────────────  panes, cards, kpis  ───────────────────────── */

.panes { display: grid; grid-template-columns: 1fr; gap: clamp(22px, 3vw, 44px); align-items: start; }
.panes > section { min-width: 0; }
@media (min-width: 900px) { .panes { grid-template-columns: var(--split, 1fr 1fr); } }
.pane-h { font-size: var(--fs-cap); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); padding-bottom: 7px; border-bottom: 1px solid var(--line); }

.cards { display: grid; gap: clamp(16px, 2.2vw, 24px); }
.cards.two { grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); }
.card-h { font-size: var(--fs-h3); font-weight: 700; padding-bottom: 6px; margin-bottom: 9px; border-bottom: 3px solid var(--accent); }
.card-b { font-size: var(--fs-body); line-height: var(--lh-relaxed); }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 148px), 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); }
@media (min-width: 700px) { .kpis.four { grid-template-columns: repeat(4, 1fr); } }
@media (min-width: 480px) and (max-width: 699px) { .kpis.four { grid-template-columns: repeat(2, 1fr); } }
.kpi { background: var(--paper); padding: clamp(13px, 1.7vw, 19px) clamp(12px, 1.5vw, 17px); }
.kpi .num { font-size: clamp(1.3rem, 1.02rem + .85vw, 1.7rem); font-weight: 700; color: var(--accent); letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1.1; }
.kpi .cap { font-size: var(--fs-cap); color: var(--muted); line-height: 1.4; margin-top: 6px; }
.kpi.q .num { color: var(--ink); }

.bullets { display: grid; gap: 11px; }
.bullets > div { font-size: var(--fs-sm); line-height: var(--lh-relaxed); padding-left: 15px; border-left: 2px solid var(--line); }
.bullets > div b { color: var(--ink); }
.bullets .ag-note { display: block; margin-top: 5px; }

ol.read { counter-reset: pt; list-style: none; display: grid; gap: clamp(16px, 2vw, 24px); }
@media (min-width: 860px) { ol.read { grid-template-columns: 1fr 1fr; column-gap: clamp(28px, 3.4vw, 52px); } }
ol.read li { counter-increment: pt; position: relative; padding-left: 32px; font-size: var(--fs-body); line-height: var(--lh-relaxed); }
ol.read li::before {
  content: counter(pt); position: absolute; left: 0; top: 1px; width: 21px; height: 21px;
  background: var(--accent); color: var(--accent-ink); font-size: var(--fs-micro); font-weight: 700;
  display: grid; place-items: center; border-radius: 50%;
}

.para { font-size: var(--fs-body); line-height: var(--lh-relaxed); max-width: 72ch; }
/* :not() carries enough specificity to beat the heading resets further down */
.stack > :not(:first-child) { margin-top: clamp(14px, 1.8vw, 20px); }
.stack-lg > :not(:first-child) { margin-top: clamp(22px, 3vw, 38px); }

/* ─────────────────────────  two-track composition  ───────────────────────── */

/* Prose never sits alone in half a canvas: it composes beside the thing it is
   about. Below 900px the tracks stack; above it, the measure is held at ~70ch
   and the second track takes the rest. */
.duo { display: grid; gap: clamp(18px, 2.4vw, 36px); align-items: start; }
.duo > * { min-width: 0; }
@media (min-width: 900px) { .duo { grid-template-columns: var(--duo, minmax(0, 58fr) minmax(0, 42fr)); } }
.duo.flip > :first-child { order: 2; }
@media (max-width: 899px) { .duo.flip > :first-child { order: 0; } }

/* the reasoning disclosure — the argument, folded behind a rule */
.reason { margin-top: clamp(22px, 2.8vw, 34px); border-top: 1px solid var(--line-strong); }
.reason > summary {
  list-style: none; cursor: pointer; display: flex; align-items: center; gap: 10px;
  min-height: 48px; padding: 13px 0 12px;
  font-size: var(--fs-cap); letter-spacing: .13em; text-transform: uppercase; color: var(--muted);
  transition: color .2s var(--ease-out);
}
.reason > summary::-webkit-details-marker { display: none; }
.reason > summary::marker { content: ''; }
.reason > summary:hover, .reason > summary:focus-visible { color: var(--accent); }
.reason > summary .gl { font-size: .8rem; color: var(--muted-2); transition: transform .34s var(--ease), color .2s var(--ease-out); display: inline-block; }
.reason[open] > summary { color: var(--accent); }
.reason[open] > summary .gl { transform: rotate(90deg); color: var(--accent); }
.reason > summary .ct { margin-left: auto; font-size: var(--fs-micro); color: var(--muted-2); letter-spacing: .06em; }
.reason-b { padding: 4px 0 18px; display: grid; gap: clamp(18px, 2.4vw, 34px); align-items: start; }
@media (min-width: 980px) { .reason-b { grid-template-columns: minmax(0, 68ch) minmax(220px, 1fr); } }
.reason-b > * { min-width: 0; }
.reason[open] > .reason-b { animation: fade .38s var(--ease-out) both; }
.rb-side .src { margin-top: 0; border-top-color: var(--line-strong); }
.rb-side > * + * { margin-top: 16px; }
/* a source note alone is set as footnote columns, never as a ribbon down one side */
.reason-b.only-src { grid-template-columns: 1fr; }
.reason-b.only-src .src { max-width: none; }
@media (min-width: 900px) {
  .reason-b.only-src .src { columns: 44ch 2; column-gap: clamp(26px, 3.4vw, 52px); column-rule: 1px solid var(--line); }
}

/* ─────────────────────────  the contents (landing)  ───────────────────────── */

.cover-slim { border-bottom: 1px solid var(--line-strong); padding-bottom: clamp(16px, 2vw, 22px); }
.cover-slim .k { font-size: var(--fs-cap); letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
.cover-slim h1 { font-size: clamp(1.9rem, 1.3rem + 2.2vw, 3rem); font-weight: 400; letter-spacing: -.028em; line-height: 1.04; margin-top: 10px; }
.cover-slim .meta { display: flex; flex-wrap: wrap; gap: 4px 22px; font-size: var(--fs-cap); color: var(--muted); margin-top: 12px; }
.cover-slim .meta .go { color: var(--accent); }

.findbar {
  display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
  border: 1px solid var(--line-mid); border-radius: 2px; background: var(--paper);
  padding: 0 14px; min-height: 52px; margin-top: clamp(18px, 2.4vw, 26px); max-width: 640px;
  transition: border-color .2s var(--ease-out), background .2s var(--ease-out);
}
.findbar:hover, .findbar:focus-visible { border-color: var(--accent); background: var(--accent-tint); }
.findbar .gl { color: var(--muted-2); font-size: 1rem; }
.findbar .t { font-size: var(--fs-body); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.findbar .kbd { margin-left: auto; font-size: var(--fs-micro); color: var(--muted-2); border: 1px solid var(--line); border-radius: 2px; padding: 3px 6px; letter-spacing: .06em; }
@media (max-width: 560px) { .findbar .kbd { display: none; } }

.contents { margin-top: clamp(22px, 3vw, 34px); border-top: 1px solid var(--line-strong); }
.crow {
  display: grid; grid-template-columns: 40px minmax(0, 1fr) minmax(150px, 23%);
  gap: 0 clamp(14px, 1.8vw, 26px); align-items: start; width: 100%; text-align: left;
  padding: clamp(15px, 1.9vw, 21px) 0; border-bottom: 1px solid var(--line);
  position: relative; transition: background .26s var(--ease-out);
}
.crow::after { content: ''; position: absolute; left: -14px; right: -14px; top: 0; bottom: 0; background: var(--accent-tint); opacity: 0; z-index: -1; transition: opacity .26s var(--ease-out); }
.crow:hover::after, .crow:focus-visible::after { opacity: 1; }
.crow:active { transform: translateY(1px); }
.crow .n { font-size: var(--fs-cap); color: var(--muted-2); font-variant-numeric: tabular-nums; padding-top: 5px; letter-spacing: .04em; }
.crow .t { display: block; font-size: clamp(1.0625rem, .98rem + .42vw, 1.32rem); letter-spacing: -.014em; line-height: 1.2; color: var(--ink); transition: color .24s var(--ease-out); }
.crow:hover .t, .crow:focus-visible .t { color: var(--accent); }
.crow .t .gl { color: var(--muted-2); margin-left: 8px; font-size: .78em; display: inline-block; transition: transform .3s var(--ease), color .24s var(--ease-out); }
.crow:hover .t .gl, .crow:focus-visible .t .gl { transform: translateX(4px); color: var(--accent); }
.crow .d { display: block; font-size: var(--fs-sm); color: var(--muted); line-height: 1.5; margin-top: 7px; max-width: 68ch; }
.crow .f { display: grid; gap: 11px; justify-items: end; text-align: right; padding-top: 3px; }
.crow .fp { display: grid; gap: 3px; justify-items: end; }
.crow .f .v { font-size: var(--fs-h3); font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.crow .f .l { font-size: var(--fs-cap); color: var(--muted-2); line-height: 1.35; }
@media (max-width: 720px) {
  .crow { grid-template-columns: 30px minmax(0, 1fr); }
  .crow .f { grid-column: 2; justify-items: start; text-align: left; margin-top: 11px;
             display: flex; flex-wrap: wrap; gap: 6px 20px; align-items: baseline; }
  .crow .fp { display: flex; gap: 7px; align-items: baseline; justify-items: start; }
  .crow .f .v { font-size: var(--fs-sm); }
}

/* ─────────────────────────  the view index (chapter hubs)  ───────────────────────── */

.vidx { border-top: 1px solid var(--line-strong); }
.vidx-h { display: flex; align-items: baseline; gap: 12px; padding: 12px 0 4px; }
.vidx-h .t { font-size: var(--fs-cap); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.vrow {
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(120px, 22%); gap: 0 clamp(14px, 2.2vw, 32px);
  align-items: baseline; width: 100%; text-align: left; padding: 13px 0; min-height: 52px;
  border-bottom: 1px solid var(--line); position: relative; transition: background .24s var(--ease-out);
}
.vrow::after { content: ''; position: absolute; left: -12px; right: -12px; top: 0; bottom: 0; background: var(--accent-tint); opacity: 0; z-index: -1; transition: opacity .24s var(--ease-out); }
.vrow:hover::after, .vrow:focus-visible::after { opacity: 1; }
.vrow .t { font-size: var(--fs-body); color: var(--ink); transition: color .22s var(--ease-out); }
.vrow:hover .t, .vrow:focus-visible .t { color: var(--accent); }
.vrow .t .gl { color: var(--muted-2); margin-left: 7px; font-size: .8em; display: inline-block; transition: transform .3s var(--ease); }
.vrow:hover .t .gl { transform: translateX(3px); }
.vrow .d { display: block; font-size: var(--fs-cap); color: var(--muted); line-height: 1.5; margin-top: 5px; max-width: 76ch; }
.vrow .f { text-align: right; font-size: var(--fs-sm); color: var(--accent); font-weight: 700; font-variant-numeric: tabular-nums; }
@media (max-width: 620px) { .vrow { grid-template-columns: 1fr; } .vrow .f { text-align: left; margin-top: 6px; } }

/* ─────────────────────────  the rate field  ───────────────────────── */

.field { margin-top: 4px; }
.field-legend { display: flex; flex-wrap: wrap; gap: 6px 20px; font-size: var(--fs-cap); color: var(--ink); margin-bottom: 18px; }
.field-legend span.k { display: inline-flex; align-items: center; gap: 7px; }
.sw { width: 20px; height: 8px; background: var(--chart-muted); flex: none; border-radius: 1px; }
.sw.dia { transform: rotate(45deg); width: 9px; height: 9px; margin: 0 2px; }
.sw.subj { background: var(--accent); }

.fieldbox { position: relative; }
.frow, .fgrid-layer, .faxis { display: grid; grid-template-columns: var(--flabel-w) 1fr; gap: 0 var(--fgap); }
.frow { align-items: center; min-height: 44px; padding: 3px 0; border: 0; width: 100%; text-align: left; transition: background .22s var(--ease-out); }
.frow + .frow { border-top: 1px solid rgba(226,226,223,.7); }
.flabel { font-size: var(--fs-sm); color: var(--ink); font-weight: 400; text-align: right; line-height: 1.25; padding: 6px 0; transition: color .22s var(--ease-out); }
.frow.subject .flabel { font-weight: 700; color: var(--accent); }
.frow.link { cursor: pointer; }
.frow.link .flabel::after { content: '›'; margin-left: 6px; color: var(--muted-2); font-weight: 400; transition: transform .3s var(--ease), color .22s var(--ease-out); display: inline-block; }
.frow.link:hover, .frow.link:focus-visible { background: var(--accent-tint); }
.frow.link:hover .flabel, .frow.link:focus-visible .flabel { color: var(--accent); }
.frow.link:hover .flabel::after, .frow.link:focus-visible .flabel::after { transform: translateX(3px); color: var(--accent); }
.frow:hover .fval, .frow:focus-visible .fval { color: var(--ink); }
.frow.link:active { opacity: .72; }

.ftrack { position: relative; height: 38px; margin-right: var(--fpad-r); }
.fbar { position: absolute; top: 50%; height: 15px; transform: translateY(-50%); background: var(--chart-muted); border-radius: 2px; transition: background .22s var(--ease-out), width .9s var(--ease), left .9s var(--ease); }
.frow.subject .fbar { background: var(--accent); }
.fmid { position: absolute; top: 50%; width: 2px; height: 21px; transform: translate(-1px, -50%); background: var(--paper); }
.fdia { position: absolute; top: 50%; width: 13px; height: 13px; transform: translate(-50%, -50%) rotate(45deg); background: var(--chart-muted); border-radius: 1.5px; transition: background .22s var(--ease-out), left .9s var(--ease); }
.frow.subject .fdia { background: var(--accent); width: 15px; height: 15px; }
.fval { position: absolute; top: 50%; transform: translateY(-50%); font-size: var(--fs-cap); color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; transition: opacity .5s var(--ease-out) .25s; }
.frow.subject .fval { color: var(--accent); font-weight: 700; }
.fval.r { transform: translate(-100%, -50%); }

.faxis { height: 24px; margin-top: 2px; }
.faxis > .plot { position: relative; margin-right: var(--fpad-r); }
.fgrid { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--line); }
.ftick { position: absolute; top: 7px; transform: translateX(-50%); font-size: var(--fs-cap); color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.fbase { position: absolute; left: 0; right: 0; top: 0; height: 1px; background: var(--line-strong); }
.fgrid-layer { position: absolute; inset: 0 0 24px 0; pointer-events: none; }
.fgrid-layer > .plot { position: relative; margin-right: var(--fpad-r); }

.freadout { min-height: 44px; margin-top: 14px; padding: 9px 12px; background: var(--surface-2); border-left: 2px solid var(--accent); font-size: var(--fs-sm); line-height: 1.5; color: var(--ink); transition: opacity .25s var(--ease-out); }
.freadout .v { font-variant-numeric: tabular-nums; }
.freadout .go { color: var(--accent); font-weight: 700; }
.freadout.idle { color: var(--muted); }

@media (max-width: 640px) {
  .frow { display: block; padding: 10px 0 2px; }
  .flabel, .ftrack { display: block; }
  .flabel { text-align: left; padding: 0; font-size: var(--fs-sm); font-weight: 700; letter-spacing: 0; }
  .frow.link .flabel::after { margin-left: 5px; }
  .ftrack { height: 30px; }
  .fgrid-layer, .faxis { display: block; }
  .fgrid-layer > .plot, .faxis > .plot { display: block; height: 100%; }
}

.tabletoggle { font-size: var(--fs-cap); letter-spacing: .09em; text-transform: uppercase; color: var(--muted); padding: 16px 0 15px; min-height: 44px; transition: color .2s var(--ease-out); }
.tabletoggle span { border-bottom: 1px solid var(--line); padding-bottom: 4px; transition: color .2s var(--ease-out), border-color .2s var(--ease-out); }
.tabletoggle:hover, .tabletoggle:hover span, .tabletoggle:focus-visible, .tabletoggle:focus-visible span { color: var(--accent); border-color: var(--accent); }
.tabletoggle:active span { opacity: .6; }

/* ─────────────────────────  waterfall  ───────────────────────── */

.wf-legend { display: flex; flex-wrap: wrap; gap: 6px 20px; font-size: var(--fs-cap); color: var(--ink); margin-bottom: 14px; }
.wf-legend span.k { display: inline-flex; align-items: center; gap: 7px; }
.wf-legend .sw.pos { background: var(--accent); }
.wf-legend .sw.neg { background: var(--neg); }
.wf-legend .sw.end { position: relative; height: 12px; background: var(--accent); }
.wf-legend .sw.end::before { content: ''; position: absolute; inset: 0 0 auto; height: 4px; background: var(--charcoal); }
.wf-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; overscroll-behavior-inline: contain; }
.wf svg { display: block; width: 100%; height: auto; font-family: inherit; }
.wf svg text { font-family: inherit; }
.wfbar rect.hit { fill: transparent; }
.wfbar:hover rect.m, .wfbar:focus-visible rect.m { opacity: .82; }
.wfbar { cursor: default; }
.wfbar:focus-visible { outline: none; }
.wfbar:focus-visible rect.hit { stroke: var(--accent); stroke-width: 2px; }
.wf-read { min-height: 44px; margin-top: 12px; padding: 9px 12px; background: var(--surface-2); border-left: 2px solid var(--accent); font-size: var(--fs-sm); line-height: 1.5; }
.wf-read.idle { color: var(--muted); }
.wf-read .v { font-variant-numeric: tabular-nums; }
.wf-read b { color: var(--ink); }

/* ─────────────────────────  ladder + sensitivity  ───────────────────────── */

.grid3 { width: 100%; border-collapse: collapse; font-size: var(--fs-sm); font-variant-numeric: tabular-nums; margin-top: 14px; }
.grid3 th, .grid3 td { padding: 11px 10px; text-align: center; border: 1px solid var(--line); }
.grid3 thead th { font-size: var(--fs-cap); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 400; border-bottom-color: var(--line-strong); }
.grid3 tbody th { font-weight: 400; color: var(--muted); font-size: var(--fs-cap); text-align: right; border-right-color: var(--line-strong); }
.grid3 td.base { background: var(--accent-tint-2); font-weight: 700; color: var(--accent); outline: 2px solid var(--accent); outline-offset: -2px; }
.grid3 td .t { display: block; font-size: var(--fs-micro); color: var(--muted-2); margin-top: 3px; letter-spacing: .04em; text-transform: uppercase; }
.grid3 td.base .t { color: var(--accent); }

.ladder { display: grid; gap: 1px; background: var(--line); border: 1px solid var(--line); }
.lad {
  display: grid; grid-template-columns: 78px minmax(0, 1fr) 92px;
  gap: 0 clamp(10px, 1.6vw, 18px); align-items: center; width: 100%; text-align: left;
  background: var(--paper); padding: 11px clamp(10px, 1.4vw, 16px); min-height: 56px;
  transition: background .22s var(--ease-out);
}
.lad:hover, .lad:focus-visible { background: var(--accent-tint); }
.lad[aria-current="true"] { background: var(--accent-tint-2); }
.lad .e { font-size: var(--fs-h3); font-weight: 700; font-variant-numeric: tabular-nums; }
.lad[aria-current="true"] .e { color: var(--accent); }
.lad .track { position: relative; height: 16px; }
.lad .track::before { content: ''; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: var(--line); }
.lad .b { position: absolute; top: 50%; left: 0; height: 10px; transform: translateY(-50%); background: var(--chart-muted); border-radius: 0 2px 2px 0; transition: width .8s var(--ease); }
.lad[aria-current="true"] .b { background: var(--accent); }
.lad .bar13 { position: absolute; top: -4px; bottom: -4px; width: 1.5px; background: var(--neg); }
.lad .irr { font-size: var(--fs-sm); font-variant-numeric: tabular-nums; text-align: right; color: var(--muted); }
.lad[aria-current="true"] .irr { color: var(--accent); font-weight: 700; }
.lad-note { font-size: var(--fs-cap); color: var(--muted); margin-top: 9px; line-height: 1.55; }
.lad-detail:empty { display: none; }
.lad-detail { border-left: 2px solid var(--accent); background: var(--surface-2); padding: 11px 14px; margin-top: 12px; font-size: var(--fs-sm); line-height: var(--lh-relaxed); }
.lad-detail .lv { display: flex; flex-wrap: wrap; gap: 4px 22px; font-variant-numeric: tabular-nums; margin-bottom: 6px; }
.lad-detail .lv b { color: var(--accent); }

/* ─────────────────────────  the register  ───────────────────────── */

.qbar { display: flex; height: 34px; background: var(--paper); gap: 2px; }
.qbar span { position: relative; display: flex; align-items: center; justify-content: center; font-size: var(--fs-micro); color: #fff; letter-spacing: .04em; font-variant-numeric: tabular-nums; min-width: 0; }
.qbar .s-answered { background: var(--accent); }
.qbar .s-partial { background: var(--chart-2); }
.qbar .s-notinroom { background: var(--chart-3); color: var(--ink); }
.qbar .s-judgment { background: var(--neg); }
.qbar-key { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: var(--fs-cap); margin-top: 9px; }
.qbar-key span { display: inline-flex; align-items: center; gap: 7px; }
.qbar-key i { width: 11px; height: 11px; flex: none; font-style: normal; }

.filters { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; align-items: center; }
.filters .fl { font-size: var(--fs-micro); letter-spacing: .13em; text-transform: uppercase; color: var(--muted-2); margin-right: 2px; }
.ft {
  display: inline-flex; align-items: center; gap: 7px; min-height: 46px; padding: 9px 13px;
  font-size: var(--fs-sm); color: var(--ink); border: 1px solid var(--line-mid); border-radius: 2px;
  background: var(--paper); transition: background .2s var(--ease-out), border-color .2s var(--ease-out), color .2s var(--ease-out);
}
.ft .c { font-size: var(--fs-cap); color: var(--muted); font-variant-numeric: tabular-nums; }
.ft i { width: 9px; height: 9px; flex: none; font-style: normal; }
.ft:hover, .ft:focus-visible { border-color: var(--accent); color: var(--accent); }
.ft[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
.ft[aria-pressed="true"] .c { color: rgba(255,255,255,.72); }
.ft[aria-pressed="true"]:hover, .ft[aria-pressed="true"]:focus-visible { background: #16293f; }
.qsearch { flex: 1 1 190px; min-width: 150px; display: flex; align-items: center; gap: 8px; border: 1px solid var(--line-mid); border-radius: 2px; padding: 0 12px; min-height: 46px; background: var(--paper); }
.qsearch input { flex: 1; min-width: 0; border: 0; outline: 0; font: inherit; font-size: var(--fs-sm); color: var(--ink); background: none; padding: 0; min-height: 46px; }
.qsearch input::placeholder { color: var(--muted-2); }
.qsearch .gl { color: var(--muted-2); font-size: .9rem; }
.qsearch:focus-within { border-color: var(--accent); }

.qcount { font-size: var(--fs-cap); color: var(--muted); margin-top: 14px; padding-bottom: 8px; border-bottom: 1px solid var(--line-strong); }
.qcount b { color: var(--ink); }
.qcount button { min-height: 44px; padding: 8px 4px; margin: -8px -4px; }
.qsec { margin-top: clamp(22px, 2.8vw, 34px); }
.qsec-h { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; padding-bottom: 7px; border-bottom: 1px solid var(--line); }
.qsec-h .t { font-size: var(--fs-h3); font-weight: 700; }
.qsec-h .c { font-size: var(--fs-cap); color: var(--muted); margin-left: auto; font-variant-numeric: tabular-nums; }
.qsub { font-size: var(--fs-cap); letter-spacing: .12em; text-transform: uppercase; color: var(--muted-2); margin-top: 18px; }

/* the register's own conventions: prose at a measure, its citation table wide */
.keys-intro p, .keys-intro li { font-size: var(--fs-sm); line-height: var(--lh-relaxed); max-width: 74ch; }
.keys-intro p + p, .keys-intro ul, .keys-intro ol { margin-top: 12px; }
.keys-intro ul, .keys-intro ol { padding-left: 20px; }
.keys-intro li { margin-top: 6px; }
.keys-intro b { color: var(--ink); }

.q { border-bottom: 1px solid var(--line); }
.q-h {
  display: grid; grid-template-columns: 34px 1fr auto; gap: 0 12px; align-items: start;
  width: 100%; text-align: left; padding: 13px 0; min-height: 52px;
  transition: background .22s var(--ease-out);
}
.q-h:hover, .q-h:focus-visible { background: var(--accent-tint); }
.q-h:active { opacity: .75; }
.q-n { font-size: var(--fs-cap); color: var(--muted-2); font-variant-numeric: tabular-nums; padding-top: 3px; letter-spacing: .04em; }
.q-t { font-size: var(--fs-body); line-height: 1.45; }
.q-h[aria-expanded="true"] .q-t { font-weight: 700; }
.q-s { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-micro); letter-spacing: .1em; text-transform: uppercase; white-space: nowrap; padding-top: 3px; }
.q-s i { width: 9px; height: 9px; flex: none; font-style: normal; }
.s-answered { background: var(--accent); }
.s-partial { background: var(--chart-2); }
.s-notinroom { background: var(--chart-3); }
.s-judgment { background: var(--neg); }
.q-s.k-answered { color: var(--accent); }
.q-s.k-partial { color: #40597a; }
.q-s.k-notinroom { color: var(--muted); }
.q-s.k-judgment { color: var(--neg); }
.q-b { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .4s var(--ease); }
.q.open .q-b { grid-template-rows: 1fr; }
.q-b > div { overflow: hidden; }
.q-b .inner { padding: 2px 0 20px 46px; max-width: 88ch; }
@media (max-width: 640px) { .q-b .inner { padding-left: 0; } .q-h { grid-template-columns: 28px 1fr; } .q-s { grid-column: 2; padding-top: 7px; } }
.q-b p { font-size: var(--fs-sm); line-height: var(--lh-relaxed); margin-top: 11px; }
.q-b p:first-child { margin-top: 4px; }
.q-b ul, .q-b ol { margin: 11px 0 0 20px; }
.q-b li { font-size: var(--fs-sm); line-height: var(--lh-relaxed); margin-top: 7px; }
.q-b em { font-style: italic; }
.q-b .tbl-scroll { margin-top: 13px; }
.q-hdr { font-size: var(--fs-sm); color: var(--muted); line-height: var(--lh-relaxed); padding: 13px 0 4px 46px; font-style: italic; }
@media (max-width: 640px) { .q-hdr { padding-left: 0; } }
.q-empty { font-size: var(--fs-sm); color: var(--muted); padding: 26px 0; line-height: var(--lh-relaxed); }
.q-empty b { color: var(--ink); }

.ask-g { margin-top: clamp(24px, 3vw, 36px); }
.ask-g:first-child { margin-top: 0; }
.ask-g .gh { display: flex; align-items: baseline; gap: 12px; padding-bottom: 7px; border-bottom: 1px solid var(--line-strong); }
.ask-g .gh .k { font-size: var(--fs-cap); color: var(--accent); font-weight: 700; letter-spacing: .1em; }
.ask-g .gh .t { font-size: var(--fs-h3); font-weight: 700; }
.ask-g .gh .c { margin-left: auto; font-size: var(--fs-cap); color: var(--muted); font-variant-numeric: tabular-nums; }
.ask { display: grid; grid-template-columns: 34px 1fr; gap: 0 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.ask .n { font-size: var(--fs-cap); color: var(--muted-2); font-variant-numeric: tabular-nums; padding-top: 2px; }
.ask .t { font-size: var(--fs-sm); line-height: var(--lh-relaxed); }

/* ─────────────────────────  the case index + case pages  ───────────────────────── */

.idx { display: grid; gap: 0; }
.idx-item {
  display: grid; grid-template-columns: 34px 1fr minmax(150px, 230px);
  gap: 0 clamp(14px, 2vw, 30px); align-items: start;
  padding: clamp(14px, 1.8vw, 20px) 0; border-bottom: 1px solid var(--line);
  width: 100%; text-align: left; position: relative;
  transition: background .28s var(--ease-out);
}
.idx-item::after { content: ''; position: absolute; left: -12px; right: -12px; top: 0; bottom: 0; background: var(--accent-tint); opacity: 0; z-index: -1; transition: opacity .28s var(--ease-out); }
.idx-item:hover::after, .idx-item:focus-visible::after { opacity: 1; }
.idx-item:active { transform: translateY(1px); }
.idx-n { font-size: var(--fs-cap); color: var(--muted-2); font-variant-numeric: tabular-nums; padding-top: 5px; letter-spacing: .04em; }
.idx-name { display: block; font-size: clamp(1.0625rem, .98rem + .42vw, 1.32rem); font-weight: 400; letter-spacing: -.014em; line-height: 1.18; color: var(--ink); transition: color .24s var(--ease-out); }
.idx-item:hover .idx-name, .idx-item:focus-visible .idx-name { color: var(--accent); }
.idx-name .gl { color: var(--muted-2); margin-left: 8px; font-size: .78em; display: inline-block; transition: transform .32s var(--ease), color .24s var(--ease-out); }
.idx-item:hover .idx-name .gl, .idx-item:focus-visible .idx-name .gl { transform: translateX(4px); color: var(--accent); }
.idx-meta { display: block; font-size: var(--fs-sm); color: var(--muted); line-height: 1.5; margin-top: 7px; max-width: 56ch; }
.idx-meta .sep { color: var(--muted-2); opacity: .55; margin: 0 9px; font-size: .85em; }
.idx-meta .gop { color: var(--accent); font-variant-numeric: tabular-nums; }

.plate { padding-top: 3px; }
.plate-v { font-size: var(--fs-cap); color: var(--ink); font-variant-numeric: tabular-nums; line-height: 1.35; }
.plate-track { position: relative; height: 13px; margin-top: 7px; }
.plate-track::before { content: ''; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: var(--line); }
.plate-bar { position: absolute; top: 50%; height: 7px; transform: translateY(-50%); background: var(--chart-muted); border-radius: 1px; }
.plate-dia { position: absolute; top: 50%; width: 8px; height: 8px; transform: translate(-50%, -50%) rotate(45deg); background: var(--chart-muted); }
.plate-subj { position: absolute; top: -3px; bottom: -3px; width: 1.5px; background: var(--accent); }
.plate-over { position: absolute; top: 50%; transform: translateY(-50%); right: -10px; font-size: var(--fs-cap); color: var(--muted); line-height: 1; }
.plate-cap { font-size: var(--fs-cap); color: var(--muted-2); margin-top: 6px; line-height: 1.4; }
.plate-none { font-size: var(--fs-cap); color: var(--muted-2); line-height: 1.45; padding-top: 2px; }
@media (max-width: 720px) { .idx-item { grid-template-columns: 26px 1fr; } .plate { grid-column: 2; padding-top: 12px; } }

.case-head { display: grid; grid-template-columns: 1fr auto; gap: 12px 24px; align-items: end; padding-bottom: 12px; border-bottom: 1px solid var(--line-strong); }
.case-num { font-size: var(--fs-cap); color: var(--muted); font-variant-numeric: tabular-nums; letter-spacing: .12em; }
@media (max-width: 620px) {
  .case-head { grid-template-columns: 1fr; gap: 0; }
  .case-head .badge { order: -1; justify-self: start; margin-bottom: 12px; }
  .case-head > div { order: 1; }
}

.ag-tbl { width: 100%; border-collapse: collapse; font-size: var(--fs-sm); }
.ag-tbl th { font-size: var(--fs-cap); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 400; text-align: left; padding: 0 14px 7px 0; border-bottom: 1px solid var(--line-strong); }
.ag-tbl th.subj { color: var(--accent); }
.ag-tbl td { padding: 11px 14px 11px 0; vertical-align: top; line-height: var(--lh-relaxed); border-bottom: 1px solid var(--line); }
.ag-tbl td.k { font-weight: 700; width: 17%; min-width: 96px; }
.ag-tbl td.s { color: var(--accent); background: var(--accent-tint); padding-left: 12px; }
.ag-note { font-size: var(--fs-cap); color: var(--muted); line-height: 1.55; display: block; margin-top: 5px; font-style: italic; }
.ag-gap { font-size: var(--fs-sm); color: var(--muted); line-height: var(--lh-relaxed); margin-top: 12px; padding-left: 12px; border-left: 2px solid var(--line); }
@media (max-width: 640px) {
  .ag-tbl, .ag-tbl tbody, .ag-tbl tr, .ag-tbl td { display: block; width: auto; }
  .ag-tbl thead { display: none; }
  .ag-tbl tr { border-bottom: 1px solid var(--line); padding: 12px 0; }
  .ag-tbl td { border: 0; padding: 0 0 5px; }
  .ag-tbl td.k { width: auto; font-size: var(--fs-cap); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 400; }
  .ag-tbl td.c::before { content: 'The comparable  '; color: var(--muted-2); font-size: var(--fs-micro); letter-spacing: .1em; text-transform: uppercase; display: block; margin-bottom: 2px; }
  .ag-tbl td.s { padding: 8px 10px; margin-top: 4px; }
  .ag-tbl td.s::before { content: 'Fawley Court  '; color: var(--accent); opacity: .7; font-size: var(--fs-micro); letter-spacing: .1em; text-transform: uppercase; display: block; margin-bottom: 2px; }
}

/* ─────────────────────────  the estimated P&Ls  ───────────────────────── */

.cls {
  display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 14px; align-items: baseline;
  border-left: 3px solid var(--accent); background: var(--accent-tint); padding: 11px 14px;
}
.cls.est { border-left-color: var(--chart-muted); background: var(--surface-2); }
.cls .t { font-size: var(--fs-cap); letter-spacing: .13em; text-transform: uppercase; font-weight: 700; color: var(--accent); white-space: nowrap; }
.cls.est .t { color: var(--muted); }
.cls .d { font-size: var(--fs-sm); line-height: 1.5; color: var(--ink); }
.cls .e { grid-column: 2; font-size: var(--fs-cap); color: var(--muted); line-height: 1.55; }
@media (max-width: 620px) { .cls { grid-template-columns: 1fr; } .cls .e { grid-column: 1; } }

.pnl-tbl { width: 100%; border-collapse: collapse; font-size: var(--fs-sm); font-variant-numeric: tabular-nums; }
.pnl-tbl th, .pnl-tbl td { padding: 7px 14px 7px 0; text-align: right; border-bottom: 1px solid var(--line); line-height: 1.45; white-space: nowrap; }
.pnl-tbl th:first-child, .pnl-tbl td:first-child { text-align: left; white-space: normal; }
.pnl-tbl thead th { font-size: var(--fs-cap); letter-spacing: .09em; text-transform: uppercase; color: var(--muted); font-weight: 400; border-bottom-color: var(--line-strong); }
.pnl-tbl tr > *:last-child { padding-right: 0; }
.pnl-tbl tr.divider td { background: var(--surface-3); font-size: var(--fs-cap); letter-spacing: .09em; text-transform: uppercase; color: var(--muted); font-weight: 700; text-align: left; }
.pnl-tbl tr.total td { border-top: 1px solid var(--line-strong); font-weight: 700; }
.pnl-tbl tr.big td { border-top: 1px solid var(--line-strong); font-weight: 700; background: var(--accent-tint); color: var(--accent); }
.pnl-tbl tr.big td .m { color: var(--accent); font-weight: 700; }
.pnl-tbl td .m { color: var(--muted); font-weight: 400; }
.pnl-tbl tr:last-child td { border-bottom: 0; }
.pnl-tbl td.neg, .pnl-tbl tr.big td.neg { color: var(--neg); }

.rank { display: grid; gap: 1px; background: var(--line); border: 1px solid var(--line); }
.rankrow {
  display: grid; grid-template-columns: minmax(120px, 21%) 74px minmax(0, 1fr) 96px;
  gap: 0 clamp(9px, 1.3vw, 16px); align-items: center; background: var(--paper);
  padding: 9px clamp(10px, 1.3vw, 15px); min-height: 46px; width: 100%; text-align: left;
  transition: background .22s var(--ease-out);
}
.rankrow.link:hover, .rankrow.link:focus-visible { background: var(--accent-tint); }
.rankrow.subj { background: var(--accent-tint-2); }
.rankrow .nm { font-size: var(--fs-sm); line-height: 1.25; }
.rankrow.subj .nm { font-weight: 700; color: var(--accent); }
.rankrow .cl { font-size: var(--fs-micro); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.rankrow .tr { position: relative; height: 15px; }
.rankrow .tr::before { content: ''; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: var(--line); }
.rankrow .zero { position: absolute; top: -3px; bottom: -3px; width: 1px; background: var(--line-strong); }
.rankrow .b { position: absolute; top: 50%; height: 10px; transform: translateY(-50%); background: var(--chart-muted); transition: width .8s var(--ease), left .8s var(--ease); }
.rankrow.subj .b { background: var(--accent); }
.rankrow .b.dn { background: var(--neg); }
.rankrow .v { text-align: right; font-size: var(--fs-sm); font-variant-numeric: tabular-nums; color: var(--muted); }
.rankrow.subj .v { color: var(--accent); font-weight: 700; }
@media (max-width: 720px) {
  .rankrow { grid-template-columns: minmax(0, 1fr) 74px; row-gap: 6px; }
  .rankrow .tr { grid-column: 1 / -1; }
  .rankrow .v { grid-row: 1; grid-column: 2; }
  .rankrow .cl { grid-row: 2; grid-column: 1 / -1; }
}

/* ─────────────────────────  plates + lightbox  ───────────────────────── */

.plates { display: grid; grid-template-columns: 1fr; gap: clamp(12px, 1.6vw, 18px); }
@media (min-width: 560px) { .plates { grid-template-columns: repeat(2, 1fr); } }
@media (min-width: 1180px) { .plates { grid-template-columns: repeat(4, 1fr); } }
.plate-fig { display: flex; flex-direction: column; text-align: left; }
.plate-fig .im { position: relative; overflow: hidden; border-radius: var(--radius); background: var(--surface-3); aspect-ratio: 3 / 2; }
.plate-fig .im img { width: 100%; height: 100%; object-fit: cover; transition: transform .8s var(--ease); }
.plate-fig:hover .im img, .plate-fig:focus-within .im img { transform: scale(1.035); }
.plate-fig:active { opacity: .72; }
.plate-fig figcaption { font-size: var(--fs-cap); line-height: 1.38; margin-top: 7px; color: var(--ink); }
.plate-fig figcaption .s { display: block; color: var(--muted-2); margin-top: 2px; }

/* the estate card's photo strip — a band of the estate, not a gallery */
.strip { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.strip button { position: relative; overflow: hidden; background: var(--surface-3); aspect-ratio: 4 / 3; min-height: 44px; }
.strip img { width: 100%; height: 100%; object-fit: cover; transition: transform .8s var(--ease), opacity .3s var(--ease-out); }
.strip button:hover img, .strip button:focus-visible img { transform: scale(1.04); }
@media (max-width: 620px) { .strip { grid-template-columns: repeat(2, 1fr); } }
.strip-cap { font-size: var(--fs-cap); color: var(--muted-2); margin-top: 8px; line-height: 1.45; }

.lb { position: fixed; inset: 0; z-index: 500; background: #141413; display: grid; grid-template-rows: minmax(0, 1fr) auto; opacity: 0; pointer-events: none; transition: opacity .34s var(--ease-out); }
body.lb-open .mast, body.lb-open .bar, body.lb-open .sheet { visibility: hidden; }
body.lb-open { overflow: hidden; }
.lb.on { opacity: 1; pointer-events: auto; }
.lb-im { position: relative; min-height: 0; }
.lb-im img {
  position: absolute; top: calc(24px + var(--safe-t)); left: max(20px, var(--safe-l));
  width: calc(100% - max(20px, var(--safe-l)) - max(20px, var(--safe-r)));
  height: calc(100% - 36px - var(--safe-t));
  max-width: none; object-fit: contain;
}
.lb-foot { padding: 14px max(20px, var(--safe-l)) calc(18px + var(--safe-b)); display: flex; align-items: center; gap: 18px; color: #f0f0ee; border-top: 1px solid rgba(255,255,255,.12); }
.lb-cap { font-size: var(--fs-sm); line-height: 1.4; }
.lb-cap .s { display: block; font-size: var(--fs-cap); color: #9d9d99; margin-top: 3px; }
.lb-nav { margin-left: auto; display: flex; gap: 4px; flex: none; }
.lb-nav button, .lb-x { width: 44px; height: 44px; display: grid; place-items: center; color: #f0f0ee; font-size: 1.1rem; border: 1px solid rgba(255,255,255,.22); border-radius: 2px; transition: background .2s var(--ease-out), border-color .2s var(--ease-out); }
.lb-nav button:hover, .lb-nav button:focus-visible, .lb-x:hover, .lb-x:focus-visible { background: rgba(255,255,255,.12); border-color: rgba(255,255,255,.45); }
.lb :focus-visible { outline-color: #fff; }
.lb-x { position: absolute; z-index: 3; top: calc(14px + var(--safe-t)); right: max(16px, var(--safe-r)); border-color: rgba(255,255,255,.25); background: rgba(20,20,19,.55); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }

/* ─────────────────────────  pager + foot + contact  ───────────────────────── */

.pager { display: flex; gap: 10px; justify-content: space-between; margin-top: clamp(26px, 3.4vw, 44px); border-top: 1px solid var(--line-strong); padding-top: 14px; }
.pager button { display: flex; flex-direction: column; gap: 4px; padding: 8px 0; max-width: 46%; min-height: 44px; transition: color .22s var(--ease-out); }
.pager button:hover, .pager button:focus-visible { color: var(--accent); }
.pager button:active { opacity: .72; }
.pager .pg-l { font-size: var(--fs-cap); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.pager .nm { font-size: var(--fs-sm); line-height: 1.3; text-align: left; }
.pager .r { text-align: right; align-items: flex-end; margin-left: auto; }
.pager .r .nm { text-align: right; }
.pager button[hidden] { display: none; }

.contact { padding-left: 16px; border-left: 3px solid var(--accent); }
.contact .name { font-size: var(--fs-h3); font-weight: 700; }
.contact .role { font-size: var(--fs-sm); color: var(--muted); margin-top: 3px; }
.contact .accent { font-size: var(--fs-sm); color: var(--accent); margin-top: 7px; }
.contact .muted { font-size: var(--fs-cap); margin-top: 12px; }

.foot { margin-top: clamp(30px, 4vw, 52px); padding: 12px 0 26px; border-top: 1px solid var(--line-strong); display: flex; align-items: center; gap: 16px; }
.foot .t { font-size: var(--fs-cap); letter-spacing: .04em; text-transform: uppercase; color: var(--ink); }
.foot img { height: 15px; width: auto; opacity: .55; margin-left: auto; }
.foot .d { font-size: var(--fs-cap); color: var(--muted); }
@media (max-width: 560px) { .foot .d { display: none; } }

/* ─────────────────────────  cheat sheet  ───────────────────────── */

.cs-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: clamp(20px, 2.6vw, 34px); align-items: start; }
.cs-block { min-width: 0; }
.cs-h { font-size: var(--fs-cap); letter-spacing: .13em; text-transform: uppercase; color: var(--ink); font-weight: 700; padding-bottom: 6px; border-bottom: 1px solid var(--accent); }
.pane-h, .cs-h, .qsec-h .t { margin: 0; }
.qsec-h h3.t { line-height: 1.3; }
.cs-note { font-size: var(--fs-cap); color: var(--muted); line-height: 1.55; margin-top: 9px; }
.watch { display: grid; gap: 0; margin-top: 12px; }
.watch-i { display: grid; grid-template-columns: auto 1fr; gap: 0 12px; padding: 11px 0; border-bottom: 1px solid var(--line); align-items: start; }
.watch-i .s { font-size: var(--fs-micro); letter-spacing: .1em; text-transform: uppercase; font-weight: 700; padding-top: 2px; white-space: nowrap; }
.watch-i .s.serious { color: var(--neg); }
.watch-i .s.open { color: var(--accent); }
.watch-i .s.dd { color: #40597a; }
.watch-i .s.note { color: var(--muted); }
.watch-i .t { font-size: var(--fs-sm); line-height: 1.45; font-weight: 700; }
.watch-i .c { font-size: var(--fs-cap); color: var(--muted); line-height: 1.6; margin-top: 6px; grid-column: 2; }
@media (max-width: 560px) { .watch-i { grid-template-columns: 1fr; } .watch-i .c { grid-column: 1; } }

@media print {
  @page { margin: 14mm 12mm; }
  html { scroll-behavior: auto; }
  body { padding: 0; overflow: visible; background: #fff; }

const QS = {"source":"Research/vendor-qs-crosscheck-20260816.md","preamble":"","halves":[{"title":"Qs for Fawley Court","sections":[{"name":"Historic Construction Costs","items":[{"n":"1","q":"Confirmation that all these works have been undertaken?","status":"PARTIAL","statusLine":"**PARTIAL.** Greenway characterises the works as done: it \"reviewed the extent of works done to","body":["**PARTIAL.** Greenway characterises the works as done: it \"reviewed the extent of works done to\nthe Grade-I-listed Main House\", comparing \"the condition of the building before the works were\ncarried out and the condition of the building as of today\", and prices \"transforming the\nbuilding to its current state of repair\" (Greenway p. 5). That is an estimate of works already\nreflected in the building, not a record of expenditure — there are no invoices, contracts,\ncontractor name, dates, completion certificates or warranties, and the report is priced at\nQ2 2026 rates rather than at the time of the works (Greenway pp. 5–6).","Scope is narrower than the question assumes. The figures cover the **Main House only** and\nexclude expenditure over the same period on the Riding School, the courtyard, the chapel, the\ngate house buildings, other building or perimeter/security elements, the waterway, the\nCapability Brown landscape conservation works, and the demolition of non-listed elements\nalready removed (Greenway p. 5).","*Ask:* invoices/contracts substantiating the £40.26m, and the equivalent record for the\nbuildings Greenway excludes."],"sub":null,"header":false},{"n":"1a","q":"Are any of these works still to be done?","status":"NOT IN ROOM","statusLine":"**NOT IN ROOM.** No cost-to-complete, no snagging list, no defects register, no completion","body":["**NOT IN ROOM.** No cost-to-complete, no snagging list, no defects register, no completion\ncertificates. Greenway excludes risk, contingency and inflation entirely (Greenway p. 6), so\nthe document cannot answer a residual-works question either way."],"sub":null,"header":false},{"n":"2","q":"Can we have a breakdown of the MEP work that has been undertaken?","status":"PARTIAL","statusLine":"**PARTIAL.** There is a quantum but no breakdown. MEP appears as a single line: \"MEP Adaptations","body":["**PARTIAL.** There is a quantum but no breakdown. MEP appears as a single line: \"MEP Adaptations\nAllowance, 3,855 m², £1,450/m², £135/sq ft, **£5,589,750**\", 13.9% of construction cost\n(Greenway p. 8). No system-level split (heating, cooling, ventilation, electrical, public\nhealth, controls, life safety, IT), no drawings, no commissioning records, no O&M manuals."],"sub":null,"header":false},{"n":"2a","q":"Is there any MEP work still to be done?","status":"PARTIAL","statusLine":"**PARTIAL.** Nothing in Greenway. But JSA records the position as at 2021: the buildings \"make","body":["**PARTIAL.** Nothing in Greenway. But JSA records the position as at 2021: the buildings \"make\nuse of oil heating which has recently been totally upgraded\", and \"permission has also been\ngranted and **part implemented** for a water based heating pump system to serve the main\nbuildings on the estate\" (JSA §3.5). Part implemented means at least one MEP workstream was\nincomplete; nothing in the room states whether it has since been finished. An *Energy Report*\nby Ecovision is named (JSA §3.5) but is not in the room."],"sub":null,"header":false},{"n":"3","q":"Has the asbestos work/removal been done?","status":"PARTIAL","statusLine":"**PARTIAL.** Two separate pieces of evidence, neither conclusive.","body":["**PARTIAL.** Two separate pieces of evidence, neither conclusive.","- Main House: \"Asbestos Removal, 3,855 m², £52/m², **£200,000**\" sits within Enabling works in\n  the historic cost estimate (Greenway p. 8) — i.e. removal is priced as part of the works\n  already reflected in the building's current condition.\n- Courtyards: the 2021 application \"is also accompanied by a **Type 3 Asbestos Survey**. The\n  survey suggests no major asbestos deposits to the courtyards site\" (JSA §14.9).","Neither the survey, nor any clearance certificate, air test, or asbestos register, is in the\nroom."],"sub":null,"header":false},{"n":"4","q":"Is there a current demolition survey available or at least a management survey","status":"PARTIAL","statusLine":"**PARTIAL.** One survey is evidenced to exist — the Type 3 asbestos survey accompanying the 2021","body":["**PARTIAL.** One survey is evidenced to exist — the Type 3 asbestos survey accompanying the 2021\ncourtyards application (JSA §14.9). A Type 3 survey is the pre-demolition/major-refurbishment\ntype, so this is close to what is being asked for, but: it is five years old, it covers the\n**courtyards only**, and it is not in the room. No management survey, and nothing at all for\nthe Main House."],"sub":null,"header":false},{"n":"5","q":"What about fire stopping, fire alarm panel, directional EM signage, EM lighting and sprinklers?","status":"NOT IN ROOM","statusLine":"**NOT IN ROOM.** No fire-systems documentation of any kind. These sit inside Greenway's","body":["**NOT IN ROOM.** No fire-systems documentation of any kind. These sit inside Greenway's\nundifferentiated MEP allowance and cannot be extracted from it."],"sub":null,"header":false},{"n":"6","q":"Is there a Fire strategy in place? Proposal was signed off by the council but was it executed on?","status":"NOT IN ROOM","statusLine":"**NOT IN ROOM.** No fire strategy, no building control documentation, no completion or","body":["**NOT IN ROOM.** No fire strategy, no building control documentation, no completion or\nfinal certificates. The only fire-related material anywhere in the room is incidental to the\n2021 courtyard design: fire brigade access to the North Courtyard through the vehicle gates at\nthe south-west corner (JSA §8.8), and new entrances and stairs designed to Approved Documents\nK and M (JSA §12.1.4). Neither evidences a strategy, nor a council sign-off, nor its execution."],"sub":null,"header":false},{"n":"7","q":"Are the fireplaces live and flues in good order?","status":"NOT IN ROOM","statusLine":"**NOT IN ROOM.** No flue survey, no chimney condition report, no schedule of fireplaces. The","body":["**NOT IN ROOM.** No flue survey, no chimney condition report, no schedule of fireplaces. The\ninternal photography (`2.4.1.1`) shows fireplaces in the principal rooms but is catalogued by\nfilename only."],"sub":null,"header":false},{"n":"8","q":"Condition of fire doors generally?","status":"NOT IN ROOM","statusLine":"**NOT IN ROOM.** No fire door survey or schedule.","body":["**NOT IN ROOM.** No fire door survey or schedule."],"sub":null,"header":false},{"n":"9","q":"Condition of windows generally – do they all open and are they in good order?","status":"PARTIAL","statusLine":"**PARTIAL.** Cost evidence only, and only for works already done: \"External Windows & Doors,","body":["**PARTIAL.** Cost evidence only, and only for works already done: \"External Windows & Doors,\n3,855 m², £233/m², **£900,000**\" within Envelope & Roof (Greenway p. 8). For the courtyard\nbuildings JSA records condition directly — the Riding School's \"external brickwork walls,\ntimber roof structure, and window/door joinery are all in poor condition\" (JSA §3.2), the\nlaundry/WC block's \"existing windows are generally in poor order\" (§2.3.6), the water tower\ncarries a uPVC window to be removed (§14.3.3). Nothing on the Main House windows: no schedule,\nno condition survey, nothing on operability."],"sub":null,"header":false},{"n":"10","q":"Any issue with the roof?","status":"PARTIAL","statusLine":"**PARTIAL.** Cost evidence for the Main House — \"Roof Works, 3,855 m², £311/m², **£1,200,000**\"","body":["**PARTIAL.** Cost evidence for the Main House — \"Roof Works, 3,855 m², £311/m², **£1,200,000**\"\n(Greenway p. 8) — and condition evidence for the outbuildings only. JSA's most recent\nstructural survey at 2021 indicated the Riding School roof \"is likely to involve the\nreplacement of at least one or two roof trusses and approximately 30% of the timber rafters,\npurlins and ridge boards\", plus plywood sarking for bracing and slates carefully removed and\nrelaid (JSA §6.4–6.5); the Old Stable Block's \"existing slate roof is in poor condition, and\nthe slates will need to be removed and replaced\" (§10.6); the water tower's glazed roof is in\npoor condition (§9.6). No current roof condition survey for the Main House."],"sub":null,"header":false},{"n":"11","q":"Any CCTV in place currently? Is this monitored, what is the age of the system?","status":"NOT IN ROOM","statusLine":"**NOT IN ROOM.** Nothing on CCTV. The only security evidence is JSA's 2021 statement that \"there","body":["**NOT IN ROOM.** Nothing on CCTV. The only security evidence is JSA's 2021 statement that \"there\nis no specific security office, and very little in the way of gates, doors, etc. to guarantee\nsafety in and around the service yard … a number of thefts occurring over the years\" (JSA\n§3.7); the 2021 scheme adds security accommodation in the South Courtyard (§5.1, §7.1) and a\nbasement \"Security & Goods In\" is labelled in the Main House (Key Plans p. 8)."],"sub":null,"header":false},{"n":"12","q":"Acoustics between rooms, corridors and floors?","status":"NOT IN ROOM","statusLine":"**NOT IN ROOM.** No acoustic testing or assessment of any kind — internal or external. This","body":["**NOT IN ROOM.** No acoustic testing or assessment of any kind — internal or external. This\nmatters twice over: the same gap defeats the residential road-noise question below."],"sub":null,"header":false}],"count":{"label":"Historic Construction Costs","items":14,"counts":{"ANSWERED":0,"PARTIAL":7,"NOT IN ROOM":7}},"intro":["---"]},{"name":"Hotel Development","items":[{"n":"1","q":"There is reference to the flood plain and specifically the area changing, hence relocating some of the houses. Are there details for this?","status":"PARTIAL","statusLine":"**PARTIAL — and the two sources in the room point in opposite directions.**","body":["**PARTIAL — and the two sources in the room point in opposite directions.**","The claim the question refers to is Savills': \"Construction in the Meadows will not be impeded\nby the existing floodplain. We have been informed that **the existing masterplan is incorrect\nand the floodplains are far smaller than is currently shown. This is currently being updated by\nthe environment agency**\" (Savills p. 47). It recurs as an assumption behind the unit\npositioning: \"These recommendations are based on the assumption that the floodplain in the\nsouthwestern corner of the meadows has no material impact on the areas of the site which are\nsuitable for construction. We understand that the environment agency are in the process of\nupdating these flood zones\" (Savills p. 50). At plot level: Meadows North contains \"a small\npond in this area which also falls within a flood area, reducing the area for development,\nhowever these flood maps are being updated, and the pond may be removed\"; Riverside North /\nWoodlands is \"restricted by the density of woodlands, listed monuments and the floodplain\";\nRiverside South \"is relatively clear and is not restricted by trees or floodplains\"\n(Savills p. 11).","Against that, the only primary flood evidence in the room is older and harder: the *Flood Risk\nAssessment and Drainage Strategy* prepared by **RAB in February 2021**, quoted verbatim in JSA\n§2.7 — \"The proposed development at Fawley Court, Henley-on-Thames, RG9 3AE is located in\n**Flood Zone 3**, as defined in the NPPF … the site is shown to have a **medium-high groundwater\nvulnerability** … To mitigate the risk of fluvial flooding during the 1% AEP + 35% climate\nchange event, it is proposed to raise the finished floor level … (a minimum of **33.22 mAOD**) …\nThe proposed development must incorporate SuDS as described in Section 5.4.\"","What is missing: the RAB report itself, any Environment Agency correspondence, any revised flood\nmap or modelling, and any dated confirmation that the zones have in fact been updated. Note\nalso that EPR's own constraints drawing lists only two site-wide constraints — the Grade II*\nRegistered Park and Garden and the Fawley Court Conservation Area — and **does not map a\nfloodplain at all** (Site Plan p. 1). Align's own annotation on Masterplan CK reads \"Check for\nflood plain\" against the south-eastern strip of the housing zone.","*Ask, precisely:* the RAB FRA, and the EA evidence for the re-mapping — a date, a reference, or\na copy of the revised zone plan. Savills' entire 12-unit positioning rests on it."],"sub":null,"header":false},{"n":"2","q":"Are there more detailed plans and cost assessments for the new areas, such as the spa, to allow us to do a more detailed assessment?","status":"PARTIAL","statusLine":"**PARTIAL.** Plans: concept level only. The spa/wellness is the Concert Hall (the deconsecrated","body":["**PARTIAL.** Plans: concept level only. The spa/wellness is the Concert Hall (the deconsecrated\nchurch, described in the room as the Pavilion), and the room gives its area split — \"Concert\nHall - Wellness + 50sqm mezzanine 471 sqm\" plus \"**New Concert Hall 2-storey Extension 529\nsqm**\", totalling 1,000 sqm / 10,763.90 sq ft (Area Schedule rows 58–61) — and one preliminary\nperspective sketch, \"Preliminary designs for addition to Pavilion at Fawley Court\"\n(Brochure p. 11). There is no plan, no section, no schedule of accommodation for the spa.\nCosts: none, for the spa or for any other new area. See also New Development item 1d."],"sub":null,"header":false},{"n":"3","q":"In terms of working on the extensions that are part of existing building, is there access to structural assessments to ensure that these work?","status":"PARTIAL","statusLine":"**PARTIAL — assessments exist and are named; none is in the room.** JSA cites, for the courtyard","body":["**PARTIAL — assessments exist and are named; none is in the room.** JSA cites, for the courtyard\ngroup: \"*Courtyard Buildings and Gatehouse: Structural Engineering Appraisal of the Existing\nStructure with Comments on the Implications of the Proposed Alterations and Associated\nDrawings*\" by **Alan Baxter and Associates** (JSA §2.6); \"*Buildings Survey Report*\" by\n**William Martin & Partners LLP** for current building conditions (§2.5); and \"*A Historic\nBuilding Survey of Service Buildings at Fawley Court*\" by **Kirsty Rodwell** plus \"*Fawley Court\nConservation Plan Vols. 1-3*\" by **Dr Sarah Rutherford** (§2.4, §1.5). JSA §6.4 reports the\nstructural survey's conclusions for the Riding School roof. Historic England's 2010 letter\nconfirms the same appraisal was live then: \"English Heritage will need to be satisfied that the\nstability of the structure as a whole is not compromised by this restoration and I am encouraged\nto hear that Baxters are investigating this issue\" (JSA Appendix II, p. 24).","The consent itself makes structural detail a pre-commencement gate: before any works to the\nRiding School, a method statement for the structural reinforcement process \"with regard to the\nmovement within the Riding School\", a copy of the timber specialist's report, and the\nmethodology for the reinforcing ply diaphragm including eaves and fixing details, must be\napproved (LBC condition 3, p. 2); and before works to the historic courtyard walls and laundry\nbuilding, an internal-reinforcement methodology (condition 6, p. 3).","Nothing whatever exists for the Main House, its basement, or the **Proposed South Wing** — the\nextension \"part of existing building\" the question is most likely aimed at."],"sub":null,"header":false},{"n":"4","q":"Utilities - power, gas, water, Wi-Fi, drainage - local capacity and infrastructure details would be useful (particularly to allow for extension plans)","status":"PARTIAL","statusLine":"**PARTIAL, and thin.** What the room gives:","body":["**PART
